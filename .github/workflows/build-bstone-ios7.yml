          		// scale below the screen scale is a cheap way to speed up fill-rate-bound devices
          		// (iPad 3 / 4, A5-A6 iPhones). Configure with render_scale= in bstone_ios.ini.
          		BSConfig cfg = BSHost_GetConfig();
          		CGFloat scale = cfg.render_scale > 0 ? cfg.render_scale : [UIScreen mainScreen].scale;
          		self.contentScaleFactor = scale;
          		layer.contentsScale = scale;
          	}
