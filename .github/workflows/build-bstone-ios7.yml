          /*
          BStone iOS port: audio manager + polling audio device on top of AudioQueue (see app/BSAudio.mm).
          SPDX-License-Identifier: MIT
          */

          #include <cstring>
          #include <memory>

          #include "bstone_exception.h"
          #include "bstone_sys_audio_mgr.h"
          #include "bstone_sys_polling_audio_device.h"

          #include "bstone_sys_ios.h"
          #include "bsios_bridge.h"

          namespace bstone {
          namespace sys {

          namespace {

          class IosPollingAudioDevice final : public PollingAudioDevice
          {
          public:
          	IosPollingAudioDevice(Logger& logger, const PollingAudioDeviceOpenParam& param)
          	try
          		:
          		logger_{logger}
          	{
          		logger_.log_information("<<< Start up iOS polling audio device.");

          		if (param.channel_count <= 0 || param.channel_count > 2)
          		{
          			BSTONE_THROW_STATIC_SOURCE("Channel count out of range.");
          		}

          		if (param.desired_frame_count <= 0 || param.desired_frame_count > 65535)
          		{
          			BSTONE_THROW_STATIC_SOURCE("Frame count out of range.");
          		}

          		if (param.callback == nullptr)
          		{
          			BSTONE_THROW_STATIC_SOURCE("Null callback.");
          		}

          		callback_ = param.callback;
          		channel_count_ = param.channel_count;

          		const auto result = bsios_audio_open(
          			param.desired_rate,
          			param.channel_count,
          			param.desired_frame_count,
          			&IosPollingAudioDevice::audio_callback,
          			this,
          			&rate_,
          			&frame_count_);

          		if (result != 0)
          		{
          			BSTONE_THROW_STATIC_SOURCE("Failed to open an audio queue.");
          		}

          		is_open_ = true;
          		logger_.log_information(">>> iOS polling audio device started up.");
          	} BSTONE_END_FUNC_CATCH_ALL_THROW_NESTED

          	IosPollingAudioDevice(const IosPollingAudioDevice&) = delete;
          	IosPollingAudioDevice& operator=(const IosPollingAudioDevice&) = delete;

          	~IosPollingAudioDevice() override
          	{
          		logger_.log_information("Shut down iOS polling audio device.");

          		if (is_open_)
          		{
          			bsios_audio_close();
          		}
          	}

          private:
          	Logger& logger_;
          	PollingAudioDeviceCallback* callback_{};
          	int rate_{};
          	int channel_count_{};
          	int frame_count_{};
          	bool is_open_{};

          private:
          	int do_get_rate() const noexcept override { return rate_; }
          	int do_get_channel_count() const noexcept override { return channel_count_; }
          	int do_get_frame_count() const noexcept override { return frame_count_; }

          	void do_pause(bool is_pause) override
          	{
          		bsios_audio_pause(is_pause ? 1 : 0);
          	}

          private:
          	// Runs on the AudioQueue thread. Never lets an exception escape into C / Objective-C frames.
          	static void audio_callback(void* user_data, float* samples, int sample_count)
          	{
          		auto& self = *static_cast<IosPollingAudioDevice*>(user_data);

          		try
          		{
          			self.callback_->invoke(samples, sample_count);
          		}
          		catch (...)
          		{
          			std::memset(samples, 0, static_cast<std::size_t>(sample_count) * sizeof(float));
          		}
          	}
          };

