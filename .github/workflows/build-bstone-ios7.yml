          	const char*,
          	const char*,
          	char* buffer,
          	std::intptr_t buffer_size)
          {
          	if (buffer == nullptr || buffer_size <= 0)
          	{
          		BSTONE_THROW_STATIC_SOURCE("Invalid buffer.");
          	}

          	const auto size = bsios_get_documents_path(buffer, static_cast<std::size_t>(buffer_size));

          	if (size < 0)
          	{
          		BSTONE_THROW_STATIC_SOURCE("Failed to get the documents path (or buffer too small).");
          	}

          	return size;
