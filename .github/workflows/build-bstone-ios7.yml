          /*
          BStone iOS port: video manager, mouse manager, Vulkan manager (unavailable), GL current context
          and GL symbol resolver (replace the corresponding *_sdl2.cpp files).

          iOS has no "default framebuffer": rendering must go to an FBO whose color renderbuffer is bound to
          the CAEAGLLayer. The BStone GL renderer, however, binds framebuffer 0 whenever it wants the window
          back buffer. The symbol resolver therefore returns thin wrappers for glBindFramebuffer* that turn
          name 0 into the FBO created by bsios_gl_create().
          SPDX-License-Identifier: MIT
          */

          #include <cstring>
          #include <memory>
          #include <string>

          #include <dlfcn.h>

          #include "bstone_exception.h"
          #include "bstone_span.h"
          #include "bstone_sys_display_mode.h"
          #include "bstone_sys_gl_current_context.h"
          #include "bstone_sys_gl_symbol_resolver.h"
          #include "bstone_sys_mouse_mgr.h"
          #include "bstone_sys_video_mgr.h"
          #include "bstone_sys_vulkan_mgr.h"

          #include "bstone_sys_ios.h"
