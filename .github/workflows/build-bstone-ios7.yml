          mkdir -p "$(dirname 'ios/src/sys/bstone_sys_event_mgr_ios.cpp')"
          cat > 'ios/src/sys/bstone_sys_event_mgr_ios.cpp' <<'BSIOS_EOF'
          /*
          BStone iOS port: event manager.

          The UI layer (UIKit main thread) injects keyboard / mouse / focus / quit events through the
          bsios_event_push_* functions; the game thread drains them with EventMgr::poll_event().
          SPDX-License-Identifier: MIT
          */

          #include <atomic>
          #include <chrono>
          #include <deque>
          #include <mutex>

          #include "bstone_exception.h"
          #include "bstone_sys_event.h"
          #include "bstone_sys_event_mgr.h"
          #include "bstone_sys_keyboard_key.h"
          #include "bstone_sys_mouse.h"

          #include "bstone_sys_ios.h"
          #include "bsios_bridge.h"

          namespace bstone {
          namespace sys {

          namespace {

          constexpr auto max_queued_events = std::size_t{4096};
          constexpr auto ios_window_id = 1U;

          struct EventQueue
          {
          	std::mutex mutex;
          	std::deque<Event> events;
          	std::atomic<bool> is_relative_mouse{false};
          	unsigned int mouse_button_mask{};
          };

          EventQueue& get_queue()
          {
          	static EventQueue queue;
          	return queue;
          }

          unsigned int get_timestamp_ms()
          {
          	using namespace std::chrono;
          	return static_cast<unsigned int>(
          		duration_cast<milliseconds>(steady_clock::now().time_since_epoch()).count());
          }

          void push_event(const Event& e)
          {
          	auto& q = get_queue();
          	const std::lock_guard<std::mutex> lock{q.mutex};

          	if (q.events.size() >= max_queued_events)
          	{
          		q.events.pop_front();
          	}

          	q.events.push_back(e);
          }

          // ==========================================================================

          class IosEventMgr final : public EventMgr
          {
          public:
          	IosEventMgr(Logger& logger)
          		:
          		logger_{logger}
          	{
          		logger_.log_information("Start up iOS event manager.");
          		auto& q = get_queue();
          		const std::lock_guard<std::mutex> lock{q.mutex};
          		q.events.clear();
          	}

          	~IosEventMgr() override
          	{
          		logger_.log_information("Shut down iOS event manager.");
          	}

          private:
          	Logger& logger_;

          private:
          	bool do_is_initialized() const noexcept override
          	{
          		return true;
          	}

          	bool do_poll_event(Event& e) override
          	{
          		auto& q = get_queue();
          		const std::lock_guard<std::mutex> lock{q.mutex};

          		if (q.events.empty())
          		{
          			return false;
          		}

          		e = q.events.front();
          		q.events.pop_front();
          		return true;
          	}
          };

          } // namespace

          // ==========================================================================

          EventMgrUPtr make_ios_event_mgr(Logger& logger)
          try {
          	return std::make_unique<IosEventMgr>(logger);
          } BSTONE_END_FUNC_CATCH_ALL_THROW_NESTED

          void ios_set_relative_mouse(bool is_relative)
          {
          	get_queue().is_relative_mouse.store(is_relative);
          }

          } // namespace sys
          } // namespace bstone

          // ==========================================================================
          // C bridge (called from the UI thread).
          // ==========================================================================

          extern "C" {

          void bsios_event_push_key(int key, int is_pressed)
          {
          	using namespace bstone::sys;

          	auto e = Event{};
          	e.keyboard.type = EventType::keyboard;
          	e.keyboard.timestamp = get_timestamp_ms();
          	e.keyboard.is_pressed = (is_pressed != 0);
          	e.keyboard.key = static_cast<KeyboardKey>(key);
          	e.keyboard.repeat_count = 0;
          	e.keyboard.window_id = ios_window_id;
          	push_event(e);
          }

          void bsios_event_push_mouse_motion(int x, int y, int delta_x, int delta_y, unsigned int button_mask)
          {
          	using namespace bstone::sys;

          	auto& q = get_queue();
          	const std::lock_guard<std::mutex> lock{q.mutex};

          	// Coalesce with the previous motion event: touch move events are far more frequent than frames.
          	if (!q.events.empty() && q.events.back().common.type == EventType::mouse_motion)
          	{
          		auto& m = q.events.back().mouse_motion;
          		m.x = x;
          		m.y = y;
          		m.delta_x += delta_x;
          		m.delta_y += delta_y;
          		m.button_mask = button_mask;
          		return;
          	}

          	if (q.events.size() >= max_queued_events)
          	{
          		q.events.pop_front();
          	}

          	auto e = Event{};
          	e.mouse_motion.type = EventType::mouse_motion;
          	e.mouse_motion.timestamp = get_timestamp_ms();
          	e.mouse_motion.x = x;
          	e.mouse_motion.y = y;
          	e.mouse_motion.delta_x = delta_x;
          	e.mouse_motion.delta_y = delta_y;
          	e.mouse_motion.button_mask = button_mask;
          	e.mouse_motion.window_id = ios_window_id;
          	q.events.push_back(e);
          }

          void bsios_event_push_mouse_button(int button_index, int is_pressed, int x, int y)
          {
          	using namespace bstone::sys;

          	auto e = Event{};
          	e.mouse_button.type = EventType::mouse_button;
          	e.mouse_button.timestamp = get_timestamp_ms();
          	e.mouse_button.is_pressed = (is_pressed != 0);
          	e.mouse_button.x = x;
          	e.mouse_button.y = y;
          	e.mouse_button.button_index = button_index;
          	e.mouse_button.click_count = 1;
          	e.mouse_button.window_id = ios_window_id;
          	push_event(e);
          }

          void bsios_event_push_focus(int is_gained)
          {
          	using namespace bstone::sys;

          	auto e = Event{};
          	e.window.type = EventType::window;
          	e.window.timestamp = get_timestamp_ms();
          	e.window.event_type =
          		is_gained != 0 ? WindowEventType::keyboard_focus_gained : WindowEventType::keyboard_focus_lost;
          	e.window.id = ios_window_id;
          	push_event(e);
          }

          void bsios_event_push_quit(void)
          {
          	using namespace bstone::sys;

          	auto e = Event{};
          	e.common.type = EventType::quit;
          	e.common.timestamp = get_timestamp_ms();
          	push_event(e);
          }

          int bsios_mouse_is_relative(void)
          {
          	return bstone::sys::get_queue().is_relative_mouse.load() ? 1 : 0;
          }

          } // extern "C"
