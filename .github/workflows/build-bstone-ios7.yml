          mkdir -p "$(dirname 'ios/src/sys/bstone_sys_window_ios.cpp')"
          cat > 'ios/src/sys/bstone_sys_window_ios.cpp' <<'BSIOS_EOF'
          /*
          BStone iOS port: window manager, window and OpenGL ES context (replace bstone_sys_window*_sdl2.cpp
          and bstone_sys_gl_context_sdl2.cpp).

          There is exactly one real window on iOS: the full-screen game view owned by the UI layer. A
          sys::Window object is therefore a light-weight handle; the actual EAGL context is created by
          bsios_gl_create() when Window::make_gl_context() is called.

          BStone creates and destroys several temporary windows / contexts while probing MSAA. This is
          supported: creating a new context destroys the previous one; destroying a stale GlContext object
          (its generation is outdated) is a no-op.
          SPDX-License-Identifier: MIT
          */

          #include <memory>
          #include <string>

          #include "bstone_exception.h"
          #include "bstone_sys_display_mode.h"
          #include "bstone_sys_gl_context.h"
          #include "bstone_sys_window.h"
          #include "bstone_sys_window_mgr.h"

          #include "bstone_sys_ios.h"
          #include "bsios_bridge.h"

          namespace bstone {
          namespace sys {

          namespace {

          unsigned int g_gl_generation = 0;

          // ==========================================================================

          class IosGlContext final : public GlContext
          {
          public:
          	explicit IosGlContext(const GlContextAttributes& requested)
          	{
          		if (requested.profile != GlContextProfile::es || requested.major_version != 2)
          		{
          			BSTONE_THROW_STATIC_SOURCE("Only OpenGL ES 2.0 is available on iOS.");
          		}

          		// Free the previous context first (only one drawable exists).
          		bsios_gl_destroy();

          		bsios_trace("IosGlContext: creating context, depth_bit_count=%d", static_cast<int>(requested.depth_bit_count));
          		const int bsios_create_rc = bsios_gl_create(requested.depth_bit_count);
          		bsios_trace("IosGlContext: bsios_gl_create -> %d", bsios_create_rc);

          		if (bsios_create_rc != 0)
          		{
          			BSTONE_THROW_STATIC_SOURCE("Failed to create an OpenGL ES 2.0 context.");
          		}

          		generation_ = ++g_gl_generation;

          		// Report what was really created. Multisampling is never available on the window
          		// (iOS offers no multisampled default framebuffer), so the MSAA probe stops here.
          		attributes_ = GlContextAttributes{};
          		attributes_.is_accelerated = true;
          		attributes_.profile = GlContextProfile::es;
          		attributes_.major_version = 2;
          		attributes_.minor_version = 0;
          		attributes_.multisample_buffer_count = 0;
          		attributes_.multisample_sample_count = 0;
          		attributes_.red_bit_count = 8;
          		attributes_.green_bit_count = 8;
          		attributes_.blue_bit_count = 8;
          		attributes_.alpha_bit_count = 0;
          		attributes_.depth_bit_count = requested.depth_bit_count;
          	}

          	IosGlContext(const IosGlContext&) = delete;
          	IosGlContext& operator=(const IosGlContext&) = delete;

          	~IosGlContext() override
          	{
          		if (generation_ == g_gl_generation)
          		{
          			bsios_gl_destroy();
          		}
          	}

          private:
          	GlContextAttributes attributes_{};
          	unsigned int generation_{};

          private:
          	const GlContextAttributes& do_get_attributes() const noexcept override
          	{
          		return attributes_;
          	}
          };

          // ==========================================================================

          class IosWindow final : public Window
          {
          public:
          	explicit IosWindow(const WindowInitParam& param)
          	{
          		if (param.title != nullptr)
          		{
          			title_ = param.title;
          		}

          		if (param.renderer_type != WindowRendererType::open_gl || param.gl_attributes == nullptr)
          		{
          			BSTONE_THROW_STATIC_SOURCE("Only OpenGL ES windows are supported on iOS.");
          		}

          		gl_attributes_ = *param.gl_attributes;
          		refresh_size();
          	}

          	IosWindow(const IosWindow&) = delete;
          	IosWindow& operator=(const IosWindow&) = delete;

          	~IosWindow() override = default;

          private:
          	std::string title_{};
          	GlContextAttributes gl_attributes_{};
          	WindowSize size_{};
          	int refresh_rate_{60};

          private:
          	void refresh_size()
          	{
          		bsios_screen_get_size(&size_.width, &size_.height);
          		refresh_rate_ = bsios_screen_get_refresh_rate();
          	}

          	const char* do_get_title() override
          	{
          		return title_.c_str();
          	}

          	void do_set_title(const char* title) override
          	{
          		title_ = (title != nullptr ? title : "");
          	}

          	// The window always covers the whole screen.
          	WindowPosition do_get_position() override
          	{
          		return WindowPosition{WindowOffset{0}, WindowOffset{0}};
          	}

          	void do_set_position(WindowPosition) override
          	{}

          	WindowSize do_get_size() override
          	{
          		refresh_size();
          		return size_;
          	}

          	void do_set_size(WindowSize) override
          	{}

          	DisplayMode do_get_display_mode() override
          	{
          		refresh_size();
          		return DisplayMode{size_.width, size_.height, refresh_rate_};
          	}

          	void do_set_display_mode(const DisplayMode&) override
          	{}

          	void do_show(bool) override
          	{}

          	void do_set_rounded_corner_type(WindowRoundedCornerType) override
          	{}

          	WindowFullscreenType do_get_fullscreen_mode() override
          	{
          		return WindowFullscreenType::fake;
          	}

          	void do_set_fullscreen_mode(WindowFullscreenType) override
          	{}

          	GlContextUPtr do_make_gl_context() override
          	{
          		return std::make_unique<IosGlContext>(gl_attributes_);
          	}

          	WindowSize do_gl_get_drawable_size() override
          	{
          		auto size = WindowSize{};
          		bsios_gl_get_drawable_size(&size.width, &size.height);
          		return size;
          	}

          	void do_gl_swap_buffers() override
          	{
          		bsios_gl_swap();
          	}

          	// The software (SDL_Renderer based) path is not available; the 3D GLES 2.0 renderer is used.
          	RendererUPtr do_make_renderer(const RendererInitParam&) override
          	{
          		BSTONE_THROW_STATIC_SOURCE("The software renderer is not available on iOS; use the \"gles_2_0\" renderer.");
          	}
          };

