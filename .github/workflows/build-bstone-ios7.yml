          namespace bstone {
          namespace sys {

          namespace {

          // ==========================================================================
          // GL symbol resolver
          // ==========================================================================

          using GlBindFramebufferFunc = void (*)(unsigned int target, unsigned int framebuffer);

          GlBindFramebufferFunc g_real_bind_framebuffer = nullptr;
          GlBindFramebufferFunc g_real_bind_framebuffer_ext = nullptr;
          GlBindFramebufferFunc g_real_bind_framebuffer_oes = nullptr;

          unsigned int map_framebuffer_name(unsigned int name)
          {
          	return name != 0 ? name : bsios_gl_get_default_framebuffer();
          }

          void ios_wrap_glBindFramebuffer(unsigned int target, unsigned int framebuffer)
          {
          	g_real_bind_framebuffer(target, map_framebuffer_name(framebuffer));
          }

          void ios_wrap_glBindFramebufferEXT(unsigned int target, unsigned int framebuffer)
          {
          	g_real_bind_framebuffer_ext(target, map_framebuffer_name(framebuffer));
          }

          void ios_wrap_glBindFramebufferOES(unsigned int target, unsigned int framebuffer)
          {
          	g_real_bind_framebuffer_oes(target, map_framebuffer_name(framebuffer));
          }

          class IosGlSymbolResolver final : public GlSymbolResolver
          {
          private:
          	void* do_find_symbol(const char* symbol_name) const noexcept override
          	{
          		if (symbol_name == nullptr)
          		{
          			return nullptr;
          		}

          		// RTLD_DEFAULT: the OpenGLES framework is linked into the executable.
          		void* const symbol = dlsym(RTLD_DEFAULT, symbol_name);

          		if (symbol == nullptr)
          		{
          			static int missing_count = 0;

          			if (missing_count < 200)
          			{
          				++missing_count;
          				bsios_trace("GL symbol NOT FOUND: %s", symbol_name);
          			}

          			return nullptr;
          		}

          		if (std::strcmp(symbol_name, "glBindFramebuffer") == 0)
          		{
          			g_real_bind_framebuffer = reinterpret_cast<GlBindFramebufferFunc>(symbol);
          			return reinterpret_cast<void*>(&ios_wrap_glBindFramebuffer);
          		}

          		if (std::strcmp(symbol_name, "glBindFramebufferEXT") == 0)
          		{
          			g_real_bind_framebuffer_ext = reinterpret_cast<GlBindFramebufferFunc>(symbol);
          			return reinterpret_cast<void*>(&ios_wrap_glBindFramebufferEXT);
          		}

          		if (std::strcmp(symbol_name, "glBindFramebufferOES") == 0)
          		{
          			g_real_bind_framebuffer_oes = reinterpret_cast<GlBindFramebufferFunc>(symbol);
          			return reinterpret_cast<void*>(&ios_wrap_glBindFramebufferOES);
          		}

          		return symbol;
          	}
          };

          // ==========================================================================
          // GL current context
          // ==========================================================================

          class IosGlCurrentContext final : public GlCurrentContext
          {
          public:
          	explicit IosGlCurrentContext(Logger& logger)
          		:
          		logger_{logger}
          	{
          		logger_.log_information("Start up OpenGL ES current context.");
          	}

          	~IosGlCurrentContext() override
          	{
          		logger_.log_information("Shut down OpenGL ES current context.");
          	}

          private:
          	Logger& logger_;
          	IosGlSymbolResolver symbol_resolver_{};

          private:
          	bool do_has_extension(const char* extension_name) const noexcept override
          	{
          		using GlGetStringFunc = const unsigned char* (*)(unsigned int name);
          		constexpr auto gl_extensions = 0x1F03U;

          		if (extension_name == nullptr || extension_name[0] == '\0')
          		{
          			return false;
          		}

          		const auto gl_get_string = symbol_resolver_.find_symbol<GlGetStringFunc>("glGetString");

          		if (gl_get_string == nullptr)
          		{
          			return false;
          		}

          		const auto extensions_chars = gl_get_string(gl_extensions);

          		if (extensions_chars == nullptr)
          		{
          			return false;
          		}

          		const auto extensions = std::string{" "} + reinterpret_cast<const char*>(extensions_chars) + " ";
          		const auto needle = std::string{" "} + extension_name + " ";
          		return extensions.find(needle) != std::string::npos;
          	}

          	// The display link of iOS always presents in sync with the display: the swap interval is
          	// fixed to "standard" and cannot be changed.
          	SwapIntervalType do_get_swap_interval() const noexcept override
          	{
          		return SwapIntervalType::standard;
          	}

          	void do_set_swap_interval(SwapIntervalType swap_interval_type) override
          	{
          		switch (swap_interval_type)
          		{
          			case SwapIntervalType::none:
          			case SwapIntervalType::standard:
          				break;

          			default:
          				BSTONE_THROW_STATIC_SOURCE("Unsupported swap interval type.");
          		}
          	}

          	const GlSymbolResolver& do_get_symbol_resolver() const noexcept override
          	{
          		return symbol_resolver_;
          	}
          };

