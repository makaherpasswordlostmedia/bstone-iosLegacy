          mkdir -p "$(dirname 'ios/tools/gen_sources.py')"
          cat > 'ios/tools/gen_sources.py' <<'BSIOS_EOF'
          #!/usr/bin/env python3
          """Generates ios/sources.mk (the list of C++ translation units for the iOS build) from the CMake
          source lists of BStone, so the Theos Makefile does not drift from upstream.

          Excluded: SDL2 / Win32 / OpenAL-less pieces that are replaced by ios/src/sys/*.cpp, tests, and
          anything not a translation unit.
          Usage: python3 ios/tools/gen_sources.py   (run from the repository root)
          """
          import os
          import re
          import sys

          root = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
          cmake = open(os.path.join(root, 'src/bstone/CMakeLists.txt')).read()

          listed = re.findall(r'^\s*(src/[^\s)]+\.cpp)\s*$', cmake, re.M)

          EXCLUDE = [
              r'_sdl2',            # replaced by ios/src/sys
              r'win32',            # Win32 only
              r'bstone_process_posix\.cpp',   # fork()/exec() are unavailable on iOS -> ios/src/sys/bstone_sys_misc_ios.cpp
              r'bstone_entry_point\.cpp',     # Windows-only wmain shim
              r'_tests?\.cpp',
          ]

          srcs = []
          for f in listed:
              if any(re.search(p, f) for p in EXCLUDE):
                  continue
              if f not in srcs:
                  srcs.append(f)
          srcs.sort()

          def emit(var, prefix, files):
              out = [var + ' = \\']
              out += ['\t%s%s \\' % (prefix, f) for f in files]
              out[-1] = out[-1].rstrip(' \\')
              return '\n'.join(out)

          libs = [
              ('../src/lib/nuked_opl3/src/opl3.cpp'),
              ('../src/lib/xbrz/src/xbrz.cpp'),
              ('../src/lib/vulkan/src/bstone_vulkan.cpp'),
          ]

          with open(os.path.join(root, 'ios/sources.mk'), 'w') as fp:
              fp.write('# GENERATED by ios/tools/gen_sources.py -- do not edit by hand.\n\n')
              fp.write(emit('BSTONE_ENGINE_FILES', '../src/bstone/', srcs) + '\n\n')
              fp.write(emit('BSTONE_LIB_FILES', '', libs) + '\n')

          print('%d engine files, %d lib files' % (len(srcs), len(libs)))
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/tools/gen_version.sh')"
