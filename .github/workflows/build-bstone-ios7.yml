          mkdir -p "$(dirname 'ios/src/app/BSHost.mm')"
          cat > 'ios/src/app/BSHost.mm' <<'BSIOS_EOF'
          // BSHost.mm -- implementation of the non-GL, non-audio part of bsios_bridge.h plus the game thread.
          #import "BSHost.h"
          #import "BSGLView.h"

          #include <atomic>
          #include <pthread.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <dispatch/dispatch.h>

          #include "bsios_bridge.h"

          // ---------------------------------------------------------------------------
          // State
          // ---------------------------------------------------------------------------
          static BSConfig g_config = {1.0f, 1, 0};

          static BSGLView* g_gl_view;                    // strong; set once on the main thread before the game starts
          static std::atomic<int> g_view_px_w(0);
          static std::atomic<int> g_view_px_h(0);

          static std::atomic<int> g_game_running(0);
          static std::atomic<int> g_game_finished(0);

          static NSCondition* g_active_cond;             // guards g_is_active / g_is_parked
          static BOOL g_is_active = YES;
          static BOOL g_is_parked = NO;

          static NSMutableArray* g_argv_storage;         // keeps the C strings of argv alive

          // ---------------------------------------------------------------------------
          // Config
          // ---------------------------------------------------------------------------
          BSConfig BSHost_GetConfig(void) { return g_config; }

          NSString* BSHost_DocumentsPath(void) {
          	NSString* dir = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
          	if (![dir hasSuffix:@"/"]) dir = [dir stringByAppendingString:@"/"];
          	return dir;
          }

          static NSString* ReadIniValue(NSString* ini, NSString* key) {
          	for (NSString* rawLine in [ini componentsSeparatedByCharactersInSet:[NSCharacterSet newlineCharacterSet]]) {
          		NSString* line = [rawLine stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
          		if (line.length == 0 || [line hasPrefix:@"#"] || [line hasPrefix:@";"]) continue;
          		NSRange eq = [line rangeOfString:@"="];
          		if (eq.location == NSNotFound) continue;
          		NSString* k = [[line substringToIndex:eq.location] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
          		if ([k caseInsensitiveCompare:key] != NSOrderedSame) continue;
          		return [[line substringFromIndex:eq.location + 1] stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
          	}
          	return nil;
          }

          static NSString* LoadIniText(void) {
          	NSString* path = [BSHost_DocumentsPath() stringByAppendingString:@"bstone_ios.ini"];
          	return [NSString stringWithContentsOfFile:path encoding:NSUTF8StringEncoding error:nil];
          }

          void BSHost_LoadConfig(void) {
          	g_config.render_scale = 1.0f;
          	g_config.touch_controls = 1;
          	NSString* ini = LoadIniText();
          	if (!ini) return;
          	NSString* v;
          	if ((v = ReadIniValue(ini, @"render_scale"))) {
          		float f = [v floatValue];
          		if (f >= 0.0f && f <= 4.0f) g_config.render_scale = f;
          	}
          	if ((v = ReadIniValue(ini, @"touch_controls"))) g_config.touch_controls = [v intValue] != 0;
          }

          // ---------------------------------------------------------------------------
          // View / activity
          // ---------------------------------------------------------------------------
          void BSHost_SetGLView(BSGLView* view) { g_gl_view = view; }
          BSGLView* BSHost_GLView(void) { return g_gl_view; }

          void BSHost_SetViewPixelSize(int w, int h) {
          	g_view_px_w.store(w);
          	g_view_px_h.store(h);
          }

          static void EnsureCond(void) {
          	static dispatch_once_t once;
          	dispatch_once(&once, ^{ g_active_cond = [[NSCondition alloc] init]; });
          }

          void BSHost_SetActive(BOOL active) {
          	EnsureCond();
          	[g_active_cond lock];
          	g_is_active = active;
          	[g_active_cond broadcast];
          	[g_active_cond unlock];
          }

          void BSHost_ParkIfInactive(void (*before_park)(void)) {
          	EnsureCond();
          	[g_active_cond lock];
          	if (!g_is_active && before_park) before_park();   // e.g. glFinish(): GL work must be complete when we park
          	while (!g_is_active) {
          		g_is_parked = YES;
          		[g_active_cond broadcast];
          		[g_active_cond wait];
          	}
          	g_is_parked = NO;
          	[g_active_cond unlock];
          }

          void BSHost_WaitUntilParked(int timeout_ms) {
          	EnsureCond();
          	if (!g_game_running.load() || g_game_finished.load()) return;
          	NSDate* deadline = [NSDate dateWithTimeIntervalSinceNow:timeout_ms / 1000.0];
          	[g_active_cond lock];
          	while (!g_is_parked && !g_game_finished.load()) {
          		if (![g_active_cond waitUntilDate:deadline]) break;   // timed out: never block the main thread for long
          	}
          	[g_active_cond unlock];
          }

          BOOL BSHost_IsGameRunning(void) { return g_game_running.load() != 0 && g_game_finished.load() == 0; }

          // ---------------------------------------------------------------------------
          // bsios_bridge.h: screen / files
          // ---------------------------------------------------------------------------
          extern "C" void bsios_screen_get_size(int* width, int* height) {
          	int w = g_view_px_w.load(), h = g_view_px_h.load();
          	if (w <= 0 || h <= 0) {   // before the first layout: derive from the screen (landscape)
          		CGRect b = [UIScreen mainScreen].bounds;
          		CGFloat s = g_config.render_scale > 0 ? g_config.render_scale : [UIScreen mainScreen].scale;
          		w = (int)(MAX(b.size.width, b.size.height) * s);
          		h = (int)(MIN(b.size.width, b.size.height) * s);
          	}
          	*width = w;
          	*height = h;
          }

          extern "C" int bsios_screen_get_refresh_rate(void) { return 60; }

          extern "C" int bsios_get_documents_path(char* buffer, size_t buffer_size) {
          	const char* p = BSHost_DocumentsPath().fileSystemRepresentation;
          	size_t n = strlen(p);
          	bool slash = n == 0 || p[n - 1] != '/';
          	if (n + (slash ? 1 : 0) + 1 > buffer_size) return -1;
          	memcpy(buffer, p, n);
          	if (slash) buffer[n++] = '/';
          	buffer[n] = 0;
          	return (int)n;
          }

          // ---------------------------------------------------------------------------
          // Message box (UIAlertView: UIAlertController does not exist before iOS 8)
          // ---------------------------------------------------------------------------
          @interface BSAlertWaiter : NSObject <UIAlertViewDelegate>
          @property (nonatomic) dispatch_semaphore_t semaphore;
          @property (nonatomic) NSInteger result;
          @end

          @implementation BSAlertWaiter
          - (void)alertView:(UIAlertView*)alertView clickedButtonAtIndex:(NSInteger)buttonIndex {
          	self.result = buttonIndex;
          	dispatch_semaphore_signal(self.semaphore);
          }
          - (void)alertViewCancel:(UIAlertView*)alertView {
          	self.result = 0;
          	dispatch_semaphore_signal(self.semaphore);
          }
          @end

          extern "C" int bsios_message_box(const char* title, const char* message,
                                           const char* const* button_titles, int button_count) {
          	if (button_count <= 0) return -1;
          	NSString* t = [NSString stringWithUTF8String:title ? title : ""];
          	NSString* m = [NSString stringWithUTF8String:message ? message : ""];
          	NSMutableArray* titles = [NSMutableArray array];
          	for (int i = 0; i < button_count; i++)
          		[titles addObject:[NSString stringWithUTF8String:button_titles[i] ? button_titles[i] : ""]];

          	BSAlertWaiter* waiter = [[BSAlertWaiter alloc] init];
          	waiter.semaphore = dispatch_semaphore_create(0);
          	waiter.result = -1;

          	// Asynchronous hop: the game thread must never dispatch_sync() to the main thread.
          	dispatch_async(dispatch_get_main_queue(), ^{
          		UIAlertView* av = [[UIAlertView alloc] initWithTitle:t message:m delegate:waiter
          		                                   cancelButtonTitle:titles[0] otherButtonTitles:nil];
          		for (NSUInteger i = 1; i < titles.count; i++) [av addButtonWithTitle:titles[i]];
          		[av show];
          	});
          	dispatch_semaphore_wait(waiter.semaphore, DISPATCH_TIME_FOREVER);
          	return (int)waiter.result;
          }

          // ---------------------------------------------------------------------------
          // Game thread
          // ---------------------------------------------------------------------------
          static void* GameThreadMain(void*) {
          	@autoreleasepool {
          		int argc = (int)g_argv_storage.count;
          		char** argv = (char**)calloc((size_t)argc + 1, sizeof(char*));
          		for (int i = 0; i < argc; i++) argv[i] = (char*)[g_argv_storage[i] UTF8String];
          		bsios_crash_thread_init("game");
          		bsios_trace("game thread: calling bstone_game_main(argc=%d)", argc);
          		int rc = bstone_game_main(argc, argv);
          		bsios_trace("game thread: bstone_game_main returned %d", rc);
          		free(argv);
          		g_game_finished.store(1);
          		EnsureCond();
          		[g_active_cond lock]; [g_active_cond broadcast]; [g_active_cond unlock];
          		bsios_game_finished(rc);
          	}
          	return NULL;
          }

          extern "C" void bsios_game_finished(int exit_code) {
          	// The game's own "Quit" ends here. A well-behaved iOS app normally never quits itself, but a
          	// game that has been told to quit has nothing left to show.
          	dispatch_async(dispatch_get_main_queue(), ^{
          		dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.3 * NSEC_PER_SEC)),
          		               dispatch_get_main_queue(), ^{ exit(exit_code); });
          	});
          }

          void BSHost_StartGame(void) {
          	if (g_game_running.exchange(1)) return;
          	EnsureCond();

          	NSString* docs = BSHost_DocumentsPath();
          	NSString* profile = [docs stringByAppendingString:@"profile/"];
          	[[NSFileManager defaultManager] createDirectoryAtPath:profile withIntermediateDirectories:YES
          	                                           attributes:nil error:nil];

          	g_argv_storage = [NSMutableArray array];
          	[g_argv_storage addObject:@"bstone"];
          	// Game data (the original .BS6 / .VSI ... files) goes next to bstone_ios.ini, i.e. into the
          	// root of the app's iTunes File Sharing folder.
          	[g_argv_storage addObject:@"--data_dir"];
          	[g_argv_storage addObject:docs];
          	[g_argv_storage addObject:@"--profile_dir"];
          	[g_argv_storage addObject:profile];
          	// Write bstone_log.txt synchronously and flush every line: the default asynchronous logger loses
          	// the last lines before a crash, which hides where the game actually died.
          	[g_argv_storage addObject:@"--log_sync"];
          	[g_argv_storage addObject:@"--log_flush_every_message"];

          	NSString* ini = LoadIniText();
          	NSString* extra = ini ? ReadIniValue(ini, @"args") : nil;
          	if (extra.length) {
          		for (NSString* a in [extra componentsSeparatedByCharactersInSet:[NSCharacterSet whitespaceCharacterSet]])
          			if (a.length) [g_argv_storage addObject:a];
          	}

          	for (NSString* a in g_argv_storage) bsios_trace("argv: %s", a.UTF8String);

          	pthread_attr_t attr;
          	pthread_attr_init(&attr);
          	// The default secondary thread stack on iOS is 512 KiB, too small for a DOS-era engine ported
          	// with large automatic arrays.
          	pthread_attr_setstacksize(&attr, 8 * 1024 * 1024);
          	pthread_attr_setdetachstate(&attr, PTHREAD_CREATE_DETACHED);
          	pthread_t th;
          	if (pthread_create(&th, &attr, GameThreadMain, NULL) != 0) {
          		g_game_running.store(0);
          		NSLog(@"BStone: failed to start the game thread");
          	}
          	pthread_attr_destroy(&attr);
          }
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/app/BSTouchOverlay.h')"
          cat > 'ios/src/app/BSTouchOverlay.h' <<'BSIOS_EOF'
          // BSTouchOverlay.h -- on-screen controls. Translates multi-touch input into keyboard / mouse events that
          // are injected into the game through bsios_event_push_*.
          #import <UIKit/UIKit.h>

          @interface BSTouchOverlay : UIView
          // Releases every key that is currently held (call when the app resigns active).
          - (void)releaseAll;
          @end
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/app/BSTouchOverlay.mm')"
          cat > 'ios/src/app/BSTouchOverlay.mm' <<'BSIOS_EOF'
          // BSTouchOverlay.mm
          //
          // Layout (landscape):
          //   bottom-left : 8-way virtual stick (up/down = forward/back, left/right = turn) + two strafe buttons
          //   bottom-right: FIRE (Ctrl), USE (Space), RUN (latch, Shift), previous / next weapon (Q / E)
          //   top         : MENU (Esc), ENTER, TAB (stats), Y, N, and the weapon keys 1..6
          //   anywhere else: dragging turns the player (relative mouse motion, X axis)
          //
          // Every control is hit-tested by this single view, which owns all touches (multipleTouchEnabled), so
          // any combination of fingers works without per-button UIControl plumbing.
          #import "BSTouchOverlay.h"
          #import "BSHost.h"

          #include <vector>
          #include "bsios_bridge.h"
          #include "bstone_sys_keyboard_key.h"

          using bstone::sys::KeyboardKey;
          static inline int K(KeyboardKey k) { return static_cast<int>(k); }

          namespace {

          enum ControlKind { kButton, kStick, kLook };

          struct Control {
          	ControlKind kind;
          	CGPoint center;
          	CGFloat radius;                 // buttons and stick are round
          	NSString* label;
          	std::vector<int> keys;          // KeyboardKey values sent while pressed
          	BOOL latch;                     // toggles on tap instead of following the finger
          	BOOL latched;
          	int pressCount;                 // number of touches holding it (0/1)
          };

          // Press-count per key so two controls mapping to the same key do not release each other.
          static int g_key_down_count[256];

          static void KeyDown(int key) {
          	if (key < 0 || key >= 256) return;
          	if (g_key_down_count[key]++ == 0) bsios_event_push_key(key, 1);
          }
          static void KeyUp(int key) {
          	if (key < 0 || key >= 256) return;
          	if (g_key_down_count[key] > 0 && --g_key_down_count[key] == 0) bsios_event_push_key(key, 0);
          }

          enum StickDir { kDirUp = 1, kDirDown = 2, kDirLeft = 4, kDirRight = 8 };

          }  // namespace

          @implementation BSTouchOverlay {
          	std::vector<Control> _controls;
          	NSMutableDictionary* _touchToControl;   // touch pointer -> NSNumber(control index)
          	NSMutableDictionary* _lookLast;         // touch pointer -> NSValue(CGPoint last)
          	int _stickIndex;
          	int _stickDirs;                         // directions currently held by the stick
          	CGPoint _stickTouch;
          	CGFloat _unit;
          	BOOL _grabRequested;
          }

          - (instancetype)initWithFrame:(CGRect)frame {
          	if ((self = [super initWithFrame:frame])) {
          		self.backgroundColor = [UIColor clearColor];
          		self.opaque = NO;
          		self.multipleTouchEnabled = YES;
          		self.exclusiveTouch = NO;
          		_touchToControl = [NSMutableDictionary dictionary];
          		_lookLast = [NSMutableDictionary dictionary];
          		_stickIndex = -1;
          		[self buildControls];
          	}
          	return self;
          }

          - (void)layoutSubviews {
          	[super layoutSubviews];
          	[self releaseAll];
          	[self buildControls];
          	[self setNeedsDisplay];
          }

          // ---------------------------------------------------------------------------
          - (void)addButton:(NSString*)label x:(CGFloat)x y:(CGFloat)y r:(CGFloat)r keys:(std::vector<int>)keys latch:(BOOL)latch {
          	Control c = {kButton, CGPointMake(x, y), r, label, keys, latch, NO, 0};
          	_controls.push_back(c);
          }

          - (void)buildControls {
          	_controls.clear();
          	CGSize sz = self.bounds.size;
          	CGFloat W = sz.width, H = sz.height;
          	_unit = MAX(1.0, MIN(H / 320.0, 2.0));
          	CGFloat u = _unit, m = 14 * u;

          	// Stick.
          	CGFloat sr = 62 * u;
          	Control stick = {kStick, CGPointMake(m + sr, H - m - sr), sr, nil, {}, NO, NO, 0};
          	_stickIndex = (int)_controls.size();
          	_controls.push_back(stick);

          	// Strafe buttons above the stick.
          	[self addButton:@"◀" x:m + 20 * u y:H - m - 2 * sr - 24 * u r:20 * u keys:std::vector<int>{K(KeyboardKey::a)} latch:NO];
          	[self addButton:@"▶" x:m + 2 * sr - 20 * u y:H - m - 2 * sr - 24 * u r:20 * u keys:std::vector<int>{K(KeyboardKey::d)} latch:NO];

          	// Right cluster.
          	CGFloat fr = 40 * u;
          	CGFloat fx = W - m - fr, fy = H - m - fr;
          	[self addButton:@"FIRE" x:fx y:fy r:fr keys:std::vector<int>{K(KeyboardKey::left_ctrl)} latch:NO];
          	[self addButton:@"USE" x:fx - fr - 32 * u y:fy + 8 * u r:30 * u keys:std::vector<int>{K(KeyboardKey::space)} latch:NO];
          	[self addButton:@"RUN" x:fx - 6 * u y:fy - fr - 30 * u r:26 * u keys:std::vector<int>{K(KeyboardKey::left_shift)} latch:YES];
          	[self addButton:@"Q" x:fx - fr - 52 * u y:fy - 40 * u r:22 * u keys:std::vector<int>{K(KeyboardKey::q)} latch:NO];
          	[self addButton:@"E" x:fx - fr - 4 * u y:fy - 76 * u r:22 * u keys:std::vector<int>{K(KeyboardKey::e)} latch:NO];

          	// Top row: system keys, then weapons.
          	CGFloat tr = 18 * u, ty = m + tr, tx = m + tr;
          	NSArray* names = @[@"ESC", @"ENTER", @"TAB", @"Y", @"N"];
          	int sys[] = {K(KeyboardKey::esc), K(KeyboardKey::enter), K(KeyboardKey::tab), K(KeyboardKey::y), K(KeyboardKey::n)};
          	for (NSUInteger i = 0; i < names.count; i++) {
          		[self addButton:names[i] x:tx y:ty r:tr keys:std::vector<int>{sys[i]} latch:NO];
          		tx += 2 * tr + 6 * u;
          	}
          	int nums[] = {K(KeyboardKey::n1), K(KeyboardKey::n2), K(KeyboardKey::n3), K(KeyboardKey::n4), K(KeyboardKey::n5), K(KeyboardKey::n6)};
          	CGFloat wr = 15 * u;
          	CGFloat wx = W - m - wr;
          	for (int i = 5; i >= 0; i--) {
          		[self addButton:[NSString stringWithFormat:@"%d", i + 1] x:wx y:m + wr r:wr keys:std::vector<int>{nums[i]} latch:NO];
          		wx -= 2 * wr + 4 * u;
          	}
          }

          // ---------------------------------------------------------------------------
          // Hit testing
          // ---------------------------------------------------------------------------
          - (int)controlIndexAt:(CGPoint)p {
          	// Buttons win over the stick; the stick over the look area.
          	for (int i = (int)_controls.size() - 1; i >= 0; i--) {
          		const Control& c = _controls[i];
          		CGFloat dx = p.x - c.center.x, dy = p.y - c.center.y;
          		CGFloat r = c.radius + (c.kind == kButton ? 6 * _unit : 0);   // a little slop for thumbs
          		if (dx * dx + dy * dy <= r * r) return i;
          	}
          	return -1;   // look area
          }

          - (int)stickDirsForPoint:(CGPoint)p {
          	const Control& s = _controls[_stickIndex];
          	CGFloat dx = p.x - s.center.x, dy = p.y - s.center.y;
          	CGFloat dist = sqrt(dx * dx + dy * dy);
          	if (dist < s.radius * 0.22) return 0;
          	CGFloat a = atan2(-dy, dx);   // 0 = right, +pi/2 = up
          	int dirs = 0;
          	// 8 sectors of 45 degrees; diagonals set two bits.
          	if (a > M_PI / 8 && a < 7 * M_PI / 8) dirs |= kDirUp;
          	if (a < -M_PI / 8 && a > -7 * M_PI / 8) dirs |= kDirDown;
          	if (fabs(a) < 3 * M_PI / 8) dirs |= kDirRight;
          	if (fabs(a) > 5 * M_PI / 8) dirs |= kDirLeft;
          	return dirs;
          }

          - (void)applyStickDirs:(int)dirs {
          	int changed = dirs ^ _stickDirs;
          	if (!changed) return;
          	struct Map { int bit; int k1; int k2; };
          	// Forward / back are sent as both the arrow and W / S: menus navigate with the arrows, the game
          	// moves with W / S (the default BStone bindings). Left / right turn in the game and move in menus.
          	static const Map map[] = {
          		{kDirUp,    K(KeyboardKey::up),    K(KeyboardKey::w)},
          		{kDirDown,  K(KeyboardKey::down),  K(KeyboardKey::s)},
          		{kDirLeft,  K(KeyboardKey::left),  0},
          		{kDirRight, K(KeyboardKey::right), 0},
          	};
          	for (const Map& m : map) {
          		if (!(changed & m.bit)) continue;
          		if (dirs & m.bit) { KeyDown(m.k1); if (m.k2) KeyDown(m.k2); }
          		else              { KeyUp(m.k1);   if (m.k2) KeyUp(m.k2); }
          	}
          	_stickDirs = dirs;
          	[self setNeedsDisplay];
          }

          // ---------------------------------------------------------------------------
          // Touches
          // ---------------------------------------------------------------------------
          - (NSValue*)keyFor:(UITouch*)t { return [NSValue valueWithPointer:(__bridge const void*)t]; }

          - (void)pressControl:(int)i {
          	Control& c = _controls[i];
          	if (c.latch) {
          		c.latched = !c.latched;
          		for (int k : c.keys) { if (c.latched) KeyDown(k); else KeyUp(k); }
          	} else {
          		if (c.pressCount++ == 0) for (int k : c.keys) KeyDown(k);
          	}
          	[self setNeedsDisplay];
          }

          - (void)releaseControl:(int)i {
          	Control& c = _controls[i];
          	if (c.latch) return;
          	if (c.pressCount > 0 && --c.pressCount == 0) for (int k : c.keys) KeyUp(k);
          	[self setNeedsDisplay];
          }

          - (void)touchesBegan:(NSSet*)touches withEvent:(UIEvent*)event {
          	for (UITouch* t in touches) {
          		CGPoint p = [t locationInView:self];
          		int idx = [self controlIndexAt:p];
          		NSValue* key = [self keyFor:t];
          		if (idx < 0) {
          			_touchToControl[key] = @(-1);
          			_lookLast[key] = [NSValue valueWithCGPoint:p];
          			if (!bsios_mouse_is_relative()) {
          				// BStone only reads mouse deltas while the mouse is "grabbed", and the first click grabs it.
          				bsios_event_push_mouse_button(0, 1, (int)p.x, (int)p.y);
          				bsios_event_push_mouse_button(0, 0, (int)p.x, (int)p.y);
          			}
          		} else if (_controls[idx].kind == kStick) {
          			_touchToControl[key] = @(idx);
          			[self applyStickDirs:[self stickDirsForPoint:p]];
          		} else {
          			_touchToControl[key] = @(idx);
          			[self pressControl:idx];
          		}
          	}
          }

          - (void)touchesMoved:(NSSet*)touches withEvent:(UIEvent*)event {
          	for (UITouch* t in touches) {
          		NSValue* key = [self keyFor:t];
          		NSNumber* n = _touchToControl[key];
          		if (!n) continue;
          		CGPoint p = [t locationInView:self];
          		int idx = n.intValue;
          		if (idx == -1) {
          			CGPoint last = [_lookLast[key] CGPointValue];
          			// Horizontal drag turns the player; a swipe across the screen is roughly a half turn.
          			int dx = (int)lround((p.x - last.x) * 2.0);
          			if (dx != 0) {
          				bsios_event_push_mouse_motion((int)p.x, (int)p.y, dx, 0, 0);
          				_lookLast[key] = [NSValue valueWithCGPoint:p];
          			}
          		} else if (_controls[idx].kind == kStick) {
          			[self applyStickDirs:[self stickDirsForPoint:p]];
          		}
          	}
          }

          - (void)finishTouches:(NSSet*)touches {
          	for (UITouch* t in touches) {
          		NSValue* key = [self keyFor:t];
          		NSNumber* n = _touchToControl[key];
          		if (!n) continue;
          		int idx = n.intValue;
          		if (idx >= 0) {
          			if (_controls[idx].kind == kStick) [self applyStickDirs:0];
          			else [self releaseControl:idx];
          		}
          		[_touchToControl removeObjectForKey:key];
          		[_lookLast removeObjectForKey:key];
          	}
          }

          - (void)touchesEnded:(NSSet*)touches withEvent:(UIEvent*)event { [self finishTouches:touches]; }
          - (void)touchesCancelled:(NSSet*)touches withEvent:(UIEvent*)event { [self finishTouches:touches]; }

          - (void)releaseAll {
          	[self applyStickDirs:0];
          	for (Control& c : _controls) {
          		if (c.latch && c.latched) { for (int k : c.keys) KeyUp(k); c.latched = NO; }
          		while (c.pressCount > 0) { c.pressCount--; if (c.pressCount == 0) for (int k : c.keys) KeyUp(k); }
          	}
          	[_touchToControl removeAllObjects];
          	[_lookLast removeAllObjects];
          	for (int k = 0; k < 256; k++) {
          		if (g_key_down_count[k] > 0) { g_key_down_count[k] = 0; bsios_event_push_key(k, 0); }
          	}
          	[self setNeedsDisplay];
          }

          // ---------------------------------------------------------------------------
          // Drawing
          // ---------------------------------------------------------------------------
          - (void)drawRect:(CGRect)rect {
          	CGContextRef g = UIGraphicsGetCurrentContext();
          	NSDictionary* attrs = @{
          		NSFontAttributeName : [UIFont boldSystemFontOfSize:MAX(9.0, 11.0 * _unit)],
          		NSForegroundColorAttributeName : [UIColor colorWithWhite:1.0 alpha:0.85],
          	};
          	for (const Control& c : _controls) {
          		CGRect r = CGRectMake(c.center.x - c.radius, c.center.y - c.radius, 2 * c.radius, 2 * c.radius);
          		BOOL on = c.pressCount > 0 || c.latched;
          		if (c.kind == kStick) {
          			CGContextSetFillColorWithColor(g, [UIColor colorWithWhite:1 alpha:0.10].CGColor);
          			CGContextFillEllipseInRect(g, r);
          			CGContextSetStrokeColorWithColor(g, [UIColor colorWithWhite:1 alpha:0.35].CGColor);
          			CGContextSetLineWidth(g, 2);
          			CGContextStrokeEllipseInRect(g, CGRectInset(r, 1, 1));
          			// Highlight active directions with a dot.
          			CGFloat dx = 0, dy = 0;
          			if (_stickDirs & kDirLeft) dx -= 1;
          			if (_stickDirs & kDirRight) dx += 1;
          			if (_stickDirs & kDirUp) dy -= 1;
          			if (_stickDirs & kDirDown) dy += 1;
          			CGFloat n = sqrt(dx * dx + dy * dy);
          			if (n > 0) { dx /= n; dy /= n; }
          			CGFloat kr = c.radius * 0.30;
          			CGPoint kc = CGPointMake(c.center.x + dx * c.radius * 0.55, c.center.y + dy * c.radius * 0.55);
          			CGContextSetFillColorWithColor(g, [UIColor colorWithWhite:1 alpha:(n > 0 ? 0.55 : 0.25)].CGColor);
          			CGContextFillEllipseInRect(g, CGRectMake(kc.x - kr, kc.y - kr, 2 * kr, 2 * kr));
          			continue;
          		}
          		CGContextSetFillColorWithColor(g, [UIColor colorWithWhite:(on ? 1.0 : 0.0) alpha:(on ? 0.45 : 0.28)].CGColor);
          		CGContextFillEllipseInRect(g, r);
          		CGContextSetStrokeColorWithColor(g, [UIColor colorWithWhite:1 alpha:0.45].CGColor);
          		CGContextSetLineWidth(g, 1.5);
          		CGContextStrokeEllipseInRect(g, CGRectInset(r, 1, 1));
          		CGSize ts = [c.label sizeWithAttributes:attrs];
          		[c.label drawAtPoint:CGPointMake(c.center.x - ts.width / 2, c.center.y - ts.height / 2) withAttributes:attrs];
          	}
          }

          @end
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/app/main.mm')"
          cat > 'ios/src/app/main.mm' <<'BSIOS_EOF'
          #import <UIKit/UIKit.h>
          #import "BSAppDelegate.h"
          #include "bsios_bridge.h"

          int main(int argc, char* argv[]) {
          	bsios_crash_install(); // first thing: crash reporter, breadcrumb trace, heartbeat
          	@autoreleasepool {
          		return UIApplicationMain(argc, argv, nil, NSStringFromClass([BSAppDelegate class]));
          	}
          }
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/bsios_bridge.h')"
          cat > 'ios/src/bsios_bridge.h' <<'BSIOS_EOF'
          /*
          BStone iOS port.
          SPDX-License-Identifier: GPL-2.0-or-later

          Plain C bridge between the portable C++ "sys" layer (ios/src/sys, which implements
          bstone::sys on top of this header) and the Objective-C++ application layer (ios/src/app),
          which owns UIKit / EAGL / AudioQueue.

          Rules (they come from hard lessons of the zelda3 iOS port, see README_IOS.md):
            * Everything declared here is called from the GAME thread, never from the main thread.
            * No function here may dispatch_sync() to the main thread (a blocked main thread plus a
              blocked game thread is the classic deadlock of the earlier SDL-based port).
            * The functions in the "event injection" section are the opposite direction: they are
              implemented by the C++ layer and are called from the UI thread (any thread, they are locked).
          */
          #ifndef BSIOS_BRIDGE_H_
          #define BSIOS_BRIDGE_H_

          #include <stddef.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          /* ------------------------------------------------------------------------ */
          /* Screen / window                                                          */
          /* ------------------------------------------------------------------------ */

          /* Native (landscape) size of the drawable in pixels after applying the configured render scale. */
          void bsios_screen_get_size(int* width, int* height);
          int bsios_screen_get_refresh_rate(void);

          /* ------------------------------------------------------------------------ */
          /* OpenGL ES 2.0                                                            */
          /* ------------------------------------------------------------------------ */

          /*
          Creates an EAGLContext (ES2), a framebuffer with a color renderbuffer bound to the game view's
          CAEAGLLayer and (if depth_bits > 0) a depth renderbuffer, and makes the context current on
          the calling thread. Returns 0 on success, nonzero on failure.
          If a context exists it is destroyed first.
          */
          int bsios_gl_create(int depth_bits);
          void bsios_gl_destroy(void);
          void bsios_gl_get_drawable_size(int* width, int* height);

          /*
          Presents the color renderbuffer. While the application is not active (backgrounded / interrupted)
          this call parks the calling thread, because iOS kills applications that touch OpenGL in background.
          */
          void bsios_gl_swap(void);

          /* Name of the framebuffer object that stands in for the "default framebuffer" (iOS has none). */
          unsigned int bsios_gl_get_default_framebuffer(void);

          /* ------------------------------------------------------------------------ */
          /* Files                                                                    */
          /* ------------------------------------------------------------------------ */

          /* Writes a NUL-terminated path (with trailing '/') into buffer. Returns its length or -1. */
          int bsios_get_documents_path(char* buffer, size_t buffer_size);

          /* ------------------------------------------------------------------------ */
          /* Message box                                                              */
          /* ------------------------------------------------------------------------ */

          /*
          Shows a UIAlertView (UIAlertController needs iOS 8) and blocks the calling (game) thread until
          a button is pressed. Returns the index of the pressed button, or -1 on failure.
          button_titles: array of button_count titles, [0] is the default.
          */
          int bsios_message_box(const char* title, const char* message, const char* const* button_titles, int button_count);

          /* ------------------------------------------------------------------------ */
          /* Audio                                                                    */
          /* ------------------------------------------------------------------------ */

          /* Called on the audio thread; fills `sample_count` interleaved float samples (frames * channels). */
          typedef void (*bsios_audio_callback)(void* user_data, float* samples, int sample_count);

          /*
          Opens an AudioQueue output (32-bit float PCM). On success returns 0 and writes the effective
          parameters. The queue starts paused; call bsios_audio_pause(0).
          */
          int bsios_audio_open(
          	int desired_rate,
          	int channel_count,
          	int desired_frame_count,
          	bsios_audio_callback callback,
          	void* user_data,
          	int* effective_rate,
          	int* effective_frame_count);
          void bsios_audio_pause(int is_paused);
          void bsios_audio_close(void);

          /* ------------------------------------------------------------------------ */
          /* Lifetime                                                                 */
          /* ------------------------------------------------------------------------ */

          /* Game thread finished (return code of the game's main()). The app terminates the process. */
          void bsios_game_finished(int exit_code);

          /* ------------------------------------------------------------------------ */
          /* Event injection: implemented by the C++ layer, called by the UI layer.   */
          /* `key` is the integer value of bstone::sys::KeyboardKey.                  */
          /* ------------------------------------------------------------------------ */

          void bsios_event_push_key(int key, int is_pressed);
          void bsios_event_push_mouse_motion(int x, int y, int delta_x, int delta_y, unsigned int button_mask);
          void bsios_event_push_mouse_button(int button_index, int is_pressed, int x, int y);
          void bsios_event_push_focus(int is_gained);
          void bsios_event_push_quit(void);

          /* Whether the game currently wants relative mouse mode (in-game look/turn). */
          int bsios_mouse_is_relative(void);

          /* ------------------------------------------------------------------------ */
          /* Game entry                                                               */
          /* ------------------------------------------------------------------------ */

          /* Renamed main() of the game (3d_main.cpp). Runs on the game thread. */
          int bstone_game_main(int argc, char* argv[]);

          /* ------------------------------------------------------------------------ */
          /* Diagnostics: crash reporter + breadcrumb trace (bstone_ios_crash.cpp).    */
          /* Files: <Documents>/profile/bstone_{trace,trace_prev,crash}.txt            */
          /* ------------------------------------------------------------------------ */

          /* ObjC wrapper (BSCrash.mm): call first thing in main(). */
          void bsios_crash_install(void);
          void bsios_crash_install_dir(const char* profile_dir, const char* device_info);
          /* Call at the start of every thread worth naming (alternate signal stack + label). */
          void bsios_crash_thread_init(const char* name);
          /* Appends text to bstone_crash.txt (used for uncaught Objective-C exceptions). */
          void bsios_crash_note(const char* text);
          /* Unbuffered breadcrumb: survives any crash. Also kept in a ring dumped into crash reports. */
          void bsios_trace(const char* fmt, ...) __attribute__((format(printf, 1, 2)));
          void bsios_trace_mem(const char* tag);
          /* 1 while the app is in the foreground and active, 0 otherwise: detects kills without a crash report. */
          void bsios_run_state(int is_foreground_active);

          #ifdef __cplusplus
          }
          #endif

          #endif /* BSIOS_BRIDGE_H_ */
          BSIOS_EOF
          mkdir -p 'ios/src/app'
          cat > 'ios/src/app/BSCrash.mm' <<'BSIOS_EOF'
          // BSCrash.mm -- Objective-C side of the diagnostics: Documents path, device info, uncaught NSException.
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #include <sys/utsname.h>
          #include "bsios_bridge.h"

          static void BSUncaughtException(NSException* e) {
          	NSMutableString* s = [NSMutableString string];
          	[s appendFormat:@"uncaught Objective-C exception\nname: %@\nreason: %@\n", e.name, e.reason];
          	[s appendString:@"return addresses (unslid = address - slide):"];
          	for (NSNumber* n in e.callStackReturnAddresses) [s appendFormat:@" 0x%08llx", n.unsignedLongLongValue];
          	[s appendFormat:@"\nsymbols:\n%@", [e.callStackSymbols componentsJoinedByString:@"\n"]];
          	bsios_crash_note(s.UTF8String);
          }

          extern "C" void bsios_crash_install(void) {
          	NSString* docs = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
          	NSString* dir = [docs stringByAppendingString:@"/profile/"];
          	struct utsname u;
          	uname(&u);
          	NSString* info = [NSString stringWithFormat:@"%s, iOS %@, RAM %llu MB", u.machine,
          	                  [UIDevice currentDevice].systemVersion,
          	                  (unsigned long long)([NSProcessInfo processInfo].physicalMemory >> 20)];
          	bsios_crash_install_dir([dir fileSystemRepresentation], [info UTF8String]);
          	NSSetUncaughtExceptionHandler(&BSUncaughtException);
          }
          BSIOS_EOF
          mkdir -p 'ios/src/sys'
          cat > 'ios/src/sys/bstone_ios_crash.cpp' <<'BSIOS_EOF'
          // bstone_ios_crash.cpp -- crash reporter + breadcrumb trace for the BStone iOS port.
          //
          // Files written into <Documents>/profile/ :
          //   bstone_trace.txt        breadcrumbs of the current run, written unbuffered (survives any crash)
          //   bstone_trace_prev.txt   the same for the previous run
          //   bstone_crash.txt        crash reports (signal / std::terminate / ObjC exception), appended
          //
          // The signal handler only uses async-signal-safe calls (open/write/unlink, no malloc, no stdio).
          // The raw backtrace is written first, the dladdr() symbolised copy second.
          #include <errno.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <signal.h>
          #include <stdarg.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <dlfcn.h>
          #include <exception>
          #include <sys/stat.h>
          #include <sys/time.h>
          #include <sys/ucontext.h>
          #include <mach/mach.h>
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>

          #include "bsios_bridge.h"

          #define BS_BUILD_ID __DATE__ " " __TIME__

          namespace {

          const int kRingSize = 96;
          const int kLineSize = 220;
          const int kMaxThreads = 16;
          const size_t kAltStackSize = 128 * 1024;

          char g_dir[900];
          char g_crash_path[1000];
          char g_trace_path[1000];
          char g_flag_path[1000];
          char g_device_info[400];
          int g_trace_fd = -1;
          timeval g_t0;

          char g_ring[kRingSize][kLineSize];
          volatile unsigned g_ring_pos = 0;

          struct ThreadSlot
          {
          	pthread_t th;
          	char name[24];
          };

          ThreadSlot g_threads[kMaxThreads];
          volatile int g_thread_count = 0;

          volatile sig_atomic_t g_in_crash = 0;
          volatile sig_atomic_t g_terminate_active = 0;
          volatile sig_atomic_t g_report_written = 0;

          // ---------------------------------------------------------------------------
          // async-signal-safe output helpers
          // ---------------------------------------------------------------------------
          void wr(int fd, const char* s, size_t n)
          {
          	while (n > 0)
          	{
          		const ssize_t r = write(fd, s, n);

          		if (r < 0)
          		{
          			if (errno == EINTR)
          			{
          				continue;
          			}

          			return;
          		}

          		if (r == 0)
          		{
          			return;
          		}

          		s += r;
          		n -= static_cast<size_t>(r);
          	}
          }

          void ws(int fd, const char* s)
          {
          	if (s == nullptr)
          	{
          		s = "(null)";
          	}

          	wr(fd, s, strlen(s));
          }

          void wh(int fd, uintptr_t v)
          {
          	char b[2 + sizeof(uintptr_t) * 2];
          	b[0] = '0';
          	b[1] = 'x';

          	for (size_t i = 0; i < sizeof(uintptr_t) * 2; ++i)
          	{
          		const unsigned d = static_cast<unsigned>((v >> (4 * (sizeof(uintptr_t) * 2 - 1 - i))) & 0xF);
          		b[2 + i] = static_cast<char>(d < 10 ? '0' + d : 'a' + (d - 10));
          	}

          	wr(fd, b, sizeof(b));
          }

          void wd(int fd, long v)
          {
          	char b[24];
          	int i = 23;
          	const bool neg = v < 0;
          	unsigned long u = neg ? static_cast<unsigned long>(-(v + 1)) + 1UL : static_cast<unsigned long>(v);

          	if (u == 0)
          	{
          		b[i--] = '0';
          	}

          	while (u != 0)
          	{
          		b[i--] = static_cast<char>('0' + (u % 10));
          		u /= 10;
          	}

          	if (neg)
          	{
          		b[i--] = '-';
          	}

          	wr(fd, b + i + 1, static_cast<size_t>(23 - i));
          }

          long uptime_ms()
          {
          	timeval t;
          	gettimeofday(&t, nullptr);
          	return static_cast<long>((t.tv_sec - g_t0.tv_sec) * 1000L + (t.tv_usec - g_t0.tv_usec) / 1000L);
          }

          const char* thread_label(pthread_t self)
          {
          	int n = g_thread_count;

          	if (n > kMaxThreads)
          	{
          		n = kMaxThreads;
          	}

          	for (int i = 0; i < n; ++i)
          	{
          		if (pthread_equal(g_threads[i].th, self))
          		{
          			return g_threads[i].name;
          		}
          	}

          	return pthread_main_np() != 0 ? "main" : "other";
          }

          // ---------------------------------------------------------------------------
          // memory
          // ---------------------------------------------------------------------------
          void get_mem(unsigned long* resident, unsigned long* free_bytes, unsigned long* inactive_bytes)
          {
          	*resident = 0;
          	*free_bytes = 0;
          	*inactive_bytes = 0;

          	task_basic_info_data_t ti;
          	mach_msg_type_number_t ti_count = TASK_BASIC_INFO_COUNT;

          	if (task_info(mach_task_self(), TASK_BASIC_INFO, reinterpret_cast<task_info_t>(&ti), &ti_count) == KERN_SUCCESS)
          	{
          		*resident = static_cast<unsigned long>(ti.resident_size);
          	}

          	vm_size_t page_size = 4096;
          	host_page_size(mach_host_self(), &page_size);

          	vm_statistics_data_t vm;
          	mach_msg_type_number_t vm_count = HOST_VM_INFO_COUNT;

          	if (host_statistics(mach_host_self(), HOST_VM_INFO, reinterpret_cast<host_info_t>(&vm), &vm_count) == KERN_SUCCESS)
          	{
          		*free_bytes = static_cast<unsigned long>(vm.free_count) * static_cast<unsigned long>(page_size);
          		*inactive_bytes = static_cast<unsigned long>(vm.inactive_count) * static_cast<unsigned long>(page_size);
          	}
          }

          // ---------------------------------------------------------------------------
          // images / frames
          // ---------------------------------------------------------------------------
          #ifdef __LP64__
          typedef mach_header_64 BsMachHeader;
          typedef segment_command_64 BsSegment;
          const uint32_t kSegCmd = LC_SEGMENT_64;
          #else
          typedef mach_header BsMachHeader;
          typedef segment_command BsSegment;
          const uint32_t kSegCmd = LC_SEGMENT;
          #endif

          bool find_image(uintptr_t addr, uint32_t* index, intptr_t* slide)
          {
          	const uint32_t count = _dyld_image_count();

          	for (uint32_t i = 0; i < count; ++i)
          	{
          		const BsMachHeader* const mh = reinterpret_cast<const BsMachHeader*>(_dyld_get_image_header(i));

          		if (mh == nullptr)
          		{
          			continue;
          		}

          		const intptr_t image_slide = _dyld_get_image_vmaddr_slide(i);
          		const uint8_t* p = reinterpret_cast<const uint8_t*>(mh + 1);

          		for (uint32_t c = 0; c < mh->ncmds; ++c)
          		{
          			const load_command* const lc = reinterpret_cast<const load_command*>(p);

          			if (lc->cmd == kSegCmd)
          			{
          				const BsSegment* const seg = reinterpret_cast<const BsSegment*>(lc);

          				if (strcmp(seg->segname, "__PAGEZERO") != 0)
          				{
          					const uintptr_t lo = static_cast<uintptr_t>(seg->vmaddr) + static_cast<uintptr_t>(image_slide);
          					const uintptr_t hi = lo + static_cast<uintptr_t>(seg->vmsize);

          					if (addr >= lo && addr < hi)
          					{
          						*index = i;
          						*slide = image_slide;
          						return true;
          					}
          				}
          			}

          			p += lc->cmdsize;
          		}
          	}

          	return false;
          }

          void write_uuid(int fd, const BsMachHeader* mh)
          {
          	const uint8_t* p = reinterpret_cast<const uint8_t*>(mh + 1);

          	for (uint32_t c = 0; c < mh->ncmds; ++c)
          	{
          		const load_command* const lc = reinterpret_cast<const load_command*>(p);

          		if (lc->cmd == LC_UUID)
          		{
          			const uuid_command* const u = reinterpret_cast<const uuid_command*>(lc);
          			static const char hex[] = "0123456789ABCDEF";

          			for (int i = 0; i < 16; ++i)
          			{
          				if (i == 4 || i == 6 || i == 8 || i == 10)
          				{
          					ws(fd, "-");
          				}

          				char two[3] = {hex[u->uuid[i] >> 4], hex[u->uuid[i] & 0xF], 0};
          				ws(fd, two);
          			}

          			return;
          		}

          		p += lc->cmdsize;
          	}

          	ws(fd, "(no uuid)");
          }

          void dump_images(int fd)
          {
          	const uint32_t count = _dyld_image_count();

          	ws(fd, "-- images (system libraries omitted; 'unslid' = address - slide, use it with the symbol list) --\n");

          	for (uint32_t i = 0; i < count; ++i)
          	{
          		const char* const name = _dyld_get_image_name(i);

          		if (name != nullptr && (strncmp(name, "/usr/lib/", 9) == 0 || strncmp(name, "/System/", 8) == 0))
          		{
          			continue;
          		}

          		ws(fd, "  image[");
          		wd(fd, static_cast<long>(i));
          		ws(fd, "] header=");
          		wh(fd, reinterpret_cast<uintptr_t>(_dyld_get_image_header(i)));
          		ws(fd, " slide=");
          		wh(fd, static_cast<uintptr_t>(_dyld_get_image_vmaddr_slide(i)));
          		ws(fd, " uuid=");
          		write_uuid(fd, reinterpret_cast<const BsMachHeader*>(_dyld_get_image_header(i)));
          		ws(fd, " ");
          		ws(fd, name);
          		ws(fd, "\n");
          	}
          }

          void dump_frame(int fd, int depth, uintptr_t addr, bool symbolize)
          {
          #if defined(__arm__)
          	// Thumb bit of a return address.
          	const uintptr_t clean = addr & ~static_cast<uintptr_t>(1);
          #else
          	const uintptr_t clean = addr;
          #endif

          	ws(fd, "  #");
          	wd(fd, depth);
          	ws(fd, "  ");
          	wh(fd, addr);

          	uint32_t image_index = 0;
          	intptr_t slide = 0;

          	if (find_image(clean, &image_index, &slide))
          	{
          		const char* const name = _dyld_get_image_name(image_index);
          		const char* base = name;

          		for (const char* q = name; q != nullptr && *q != 0; ++q)
          		{
          			if (*q == '/')
          			{
          				base = q + 1;
          			}
          		}

          		ws(fd, "  ");
          		ws(fd, base);
          		ws(fd, "  unslid=");
          		wh(fd, clean - static_cast<uintptr_t>(slide));
          	}
          	else
          	{
          		ws(fd, "  (not in any image)");
          	}

          	if (symbolize)
          	{
          		Dl_info info;

          		if (dladdr(reinterpret_cast<void*>(clean), &info) != 0 && info.dli_sname != nullptr)
          		{
          			ws(fd, "  ");
          			ws(fd, info.dli_sname);
          			ws(fd, "+");
          			wd(fd, static_cast<long>(clean - reinterpret_cast<uintptr_t>(info.dli_saddr)));
          		}
          	}

          	ws(fd, "\n");
          }

          struct Regs
          {
          	uintptr_t pc;
          	uintptr_t lr;
          	uintptr_t sp;
          	uintptr_t fp;
          	uintptr_t cpsr;
          	uintptr_t r[13];
          	bool has_all;
          };

          bool get_regs(void* uctx, Regs* out)
          {
          #if defined(__arm__)
          	const ucontext_t* const uc = static_cast<const ucontext_t*>(uctx);

          	if (uc == nullptr || uc->uc_mcontext == nullptr)
          	{
          		return false;
          	}

          	const auto& ss = uc->uc_mcontext->__ss;

          	for (int i = 0; i < 13; ++i)
          	{
          		out->r[i] = ss.__r[i];
          	}

          	out->sp = ss.__sp;
          	out->lr = ss.__lr;
          	out->pc = ss.__pc;
          	out->cpsr = ss.__cpsr;
          	out->fp = ss.__r[7];
          	out->has_all = true;
          	return true;
          #elif defined(__aarch64__)
          	const ucontext_t* const uc = static_cast<const ucontext_t*>(uctx);

          	if (uc == nullptr || uc->uc_mcontext == nullptr)
          	{
          		return false;
          	}

          	const auto& ss = uc->uc_mcontext->__ss;

          	for (int i = 0; i < 13; ++i)
          	{
          		out->r[i] = static_cast<uintptr_t>(ss.__x[i]);
          	}

          	out->sp = static_cast<uintptr_t>(ss.__sp);
          	out->lr = static_cast<uintptr_t>(ss.__lr);
          	out->pc = static_cast<uintptr_t>(ss.__pc);
          	out->cpsr = static_cast<uintptr_t>(ss.__cpsr);
          	out->fp = static_cast<uintptr_t>(ss.__fp);
          	out->has_all = true;
          	return true;
          #else
          	static_cast<void>(uctx);
          	static_cast<void>(out);
          	return false;
          #endif
          }

          void dump_registers(int fd, const Regs& g)
          {
          	ws(fd, "-- registers --\n");

          	for (int i = 0; i < 13; ++i)
          	{
          		ws(fd, "  r");
          		wd(fd, i);
          		ws(fd, i < 10 ? "  = " : " = ");
          		wh(fd, g.r[i]);
          		ws(fd, (i % 3 == 2) ? "\n" : "");
          	}

          	ws(fd, "\n  sp = ");
          	wh(fd, g.sp);
          	ws(fd, "  lr = ");
          	wh(fd, g.lr);
          	ws(fd, "  pc = ");
          	wh(fd, g.pc);
          	ws(fd, "  cpsr = ");
          	wh(fd, g.cpsr);
          	ws(fd, "\n");
          }

          void dump_backtrace(int fd, const Regs& g, bool symbolize)
          {
          	const pthread_t self = pthread_self();
          	const uintptr_t top = reinterpret_cast<uintptr_t>(pthread_get_stackaddr_np(self));
          	const uintptr_t low = top - static_cast<uintptr_t>(pthread_get_stacksize_np(self));

          	int depth = 0;
          	dump_frame(fd, depth++, g.pc, symbolize);

          	if (g.lr != 0 && g.lr != g.pc)
          	{
          		// LR is the caller when the crash happened in a leaf function or through a null pointer.
          		dump_frame(fd, depth++, g.lr, symbolize);
          	}

          	uintptr_t fp = g.fp;

          	while (depth < 60)
          	{
          		if (fp == 0 || (fp & (sizeof(uintptr_t) - 1)) != 0 || fp < low || fp + 2 * sizeof(uintptr_t) > top)
          		{
          			break;
          		}

          		const uintptr_t next = reinterpret_cast<const uintptr_t*>(fp)[0];
          		const uintptr_t ret = reinterpret_cast<const uintptr_t*>(fp)[1];

          		if (ret == 0)
          		{
          			break;
          		}

          		dump_frame(fd, depth++, ret, symbolize);

          		if (next <= fp)
          		{
          			break;
          		}

          		fp = next;
          	}
          }

          void dump_ring(int fd)
          {
          	ws(fd, "-- last breadcrumbs (oldest first) --\n");

          	const unsigned pos = g_ring_pos;

          	for (unsigned k = 0; k < static_cast<unsigned>(kRingSize); ++k)
          	{
          		const char* const line = g_ring[(pos + k) % static_cast<unsigned>(kRingSize)];

          		if (line[0] != 0)
          		{
          			ws(fd, "  ");
          			ws(fd, line);
          			ws(fd, "\n");
          		}
          	}
          }

          void dump_common_head(int fd)
          {
          	ws(fd, "build: ");
          	ws(fd, BS_BUILD_ID);
          	ws(fd, "\ndevice: ");
          	ws(fd, g_device_info);
          	ws(fd, "\nuptime_ms: ");
          	wd(fd, uptime_ms());
          	ws(fd, "\n");
          }

          void dump_common_tail(int fd)
          {
          	unsigned long resident = 0;
          	unsigned long free_bytes = 0;
          	unsigned long inactive_bytes = 0;
          	get_mem(&resident, &free_bytes, &inactive_bytes);

          	ws(fd, "-- memory --\n  resident_mb=");
          	wd(fd, static_cast<long>(resident >> 20));
          	ws(fd, " free_mb=");
          	wd(fd, static_cast<long>(free_bytes >> 20));
          	ws(fd, " inactive_mb=");
          	wd(fd, static_cast<long>(inactive_bytes >> 20));
          	ws(fd, "\n");

          	dump_ring(fd);
          	dump_images(fd);
          	ws(fd, "==== end of report ====\n");
          }

          int open_crash_file()
          {
          	const int fd = open(g_crash_path, O_WRONLY | O_CREAT | O_APPEND, 0644);
          	return fd >= 0 ? fd : 2;
          }

          const char* signal_name(int sig)
          {
          	switch (sig)
          	{
          		case SIGSEGV: return "SIGSEGV (invalid memory access)";
          		case SIGBUS: return "SIGBUS (bad alignment / unmapped file)";
          		case SIGILL: return "SIGILL (illegal instruction)";
          		case SIGFPE: return "SIGFPE (arithmetic error)";
          		case SIGABRT: return "SIGABRT (abort())";
          		case SIGTRAP: return "SIGTRAP (trap / breakpoint)";
          		case SIGSYS: return "SIGSYS (bad system call)";
          		default: return "?";
          	}
          }

          void crash_signal_handler(int sig, siginfo_t* si, void* uctx)
          {
          	if (g_in_crash != 0)
          	{
          		return; // SA_RESETHAND: default action on re-entry
          	}

          	g_in_crash = 1;

          	if (sig == SIGABRT && g_report_written != 0)
          	{
          		return; // std::terminate already wrote the full report
          	}

          	const int fd = open_crash_file();
          	unlink(g_flag_path);

          	ws(fd, "\n==== BStone iOS crash report: signal ====\n");
          	dump_common_head(fd);

          	ws(fd, "signal: ");
          	wd(fd, sig);
          	ws(fd, " ");
          	ws(fd, signal_name(sig));
          	ws(fd, "\ncode: ");
          	wd(fd, si != nullptr ? si->si_code : 0);
          	ws(fd, "  fault_addr: ");
          	wh(fd, si != nullptr ? reinterpret_cast<uintptr_t>(si->si_addr) : 0);
          	ws(fd, "\nthread: ");
          	ws(fd, thread_label(pthread_self()));
          	ws(fd, " pthread=");
          	wh(fd, reinterpret_cast<uintptr_t>(pthread_self()));
          	ws(fd, "\n");

          	Regs g;
          	memset(&g, 0, sizeof(g));

          	if (get_regs(uctx, &g))
          	{
          		const uintptr_t fault = si != nullptr ? reinterpret_cast<uintptr_t>(si->si_addr) : 0;
          		const pthread_t self = pthread_self();
          		const uintptr_t top = reinterpret_cast<uintptr_t>(pthread_get_stackaddr_np(self));
          		const uintptr_t low = top - static_cast<uintptr_t>(pthread_get_stacksize_np(self));

          		ws(fd, "diagnosis:");

          		if (g.pc < 0x1000)
          		{
          			ws(fd, " PC is ~0: a call through a NULL function pointer (a GL/AL function that was not resolved?);"
          				" the caller is LR (frame #1).");
          		}
          		else if ((sig == SIGSEGV || sig == SIGBUS) && fault < 0x1000)
          		{
          			ws(fd, " NULL pointer dereference (offset ");
          			wh(fd, fault);
          			ws(fd, ").");
          		}
          		else if ((sig == SIGSEGV || sig == SIGBUS) && fault + (1u << 20) >= low && fault < low + 4096)
          		{
          			ws(fd, " the fault address is next to the stack limit: stack overflow is likely.");
          		}
          		else if (sig == SIGILL)
          		{
          			ws(fd, " illegal instruction: code uses a CPU feature this device does not have, or a jump into data.");
          		}
          		else if (sig == SIGABRT)
          		{
          			ws(fd, " abort() was called (failed assert, uncaught exception, runtime check).");
          		}
          		else
          		{
          			ws(fd, " (no automatic diagnosis)");
          		}

          		ws(fd, "\n");
          		dump_registers(fd, g);
          		ws(fd, "-- backtrace (raw, use 'unslid' with the symbol list) --\n");
          		dump_backtrace(fd, g, false);
          		ws(fd, "-- backtrace (dladdr names, may be empty for a stripped binary) --\n");
          		dump_backtrace(fd, g, true);
          	}
          	else
          	{
          		ws(fd, "(registers unavailable on this architecture)\n");
          	}

          	dump_common_tail(fd);
          	g_report_written = 1;

          	if (fd > 2)
          	{
          		close(fd);
          	}
          }

          void bs_terminate_handler()
          {
          	if (g_terminate_active != 0)
          	{
          		abort();
          	}

          	g_terminate_active = 1;

          	const int fd = open_crash_file();
          	unlink(g_flag_path);

          	ws(fd, "\n==== BStone iOS crash report: std::terminate ====\n");
          	dump_common_head(fd);
          	ws(fd, "thread: ");
          	ws(fd, thread_label(pthread_self()));
          	ws(fd, "\n");

          	if (std::current_exception() != nullptr)
          	{
          		try
          		{
          			throw;
          		}
          		catch (const std::exception& e)
          		{
          			ws(fd, "uncaught C++ exception, what(): ");
          			ws(fd, e.what());
          			ws(fd, "\n");
          		}
          		catch (...)
          		{
          			ws(fd, "uncaught C++ exception of unknown type\n");
          		}
          	}
          	else
          	{
          		ws(fd, "std::terminate() called without an active exception (noexcept violation / pure virtual call?)\n");
          	}

          	Regs g;
          	memset(&g, 0, sizeof(g));
          	g.pc = reinterpret_cast<uintptr_t>(__builtin_return_address(0));
          	g.fp = reinterpret_cast<uintptr_t>(__builtin_frame_address(0));

          	ws(fd, "-- backtrace (raw) --\n");
          	dump_backtrace(fd, g, false);
          	ws(fd, "-- backtrace (dladdr names) --\n");
          	dump_backtrace(fd, g, true);

          	dump_common_tail(fd);
          	g_report_written = 1;

          	if (fd > 2)
          	{
          		close(fd);
          	}

          	abort();
          }

          void install_signal_handlers()
          {
          	struct sigaction sa;
          	memset(&sa, 0, sizeof(sa));
          	sigemptyset(&sa.sa_mask);
          	sa.sa_sigaction = &crash_signal_handler;
          	sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND;

          	static const int signals[] = {SIGSEGV, SIGBUS, SIGILL, SIGFPE, SIGABRT, SIGTRAP, SIGSYS};

          	for (const int s : signals)
          	{
          		sigaction(s, &sa, nullptr);
          	}
          }

          void trace_v(bool to_ring, const char* fmt, va_list ap)
          {
          	char buf[1100];
          	const int head = snprintf(buf, sizeof(buf), "[%7ldms %-5s] ", uptime_ms(), thread_label(pthread_self()));
          	size_t len = head > 0 ? static_cast<size_t>(head) : 0;

          	if (len >= sizeof(buf) - 2)
          	{
          		len = sizeof(buf) - 3;
          	}

          	const int body = vsnprintf(buf + len, sizeof(buf) - len - 2, fmt, ap);

          	if (body > 0)
          	{
          		const size_t room = sizeof(buf) - len - 2;
          		len += (static_cast<size_t>(body) < room) ? static_cast<size_t>(body) : room - 1;
          	}

          	if (to_ring)
          	{
          		const unsigned slot = __sync_fetch_and_add(&g_ring_pos, 1u) % static_cast<unsigned>(kRingSize);
          		const size_t n = len < static_cast<size_t>(kLineSize) - 1 ? len : static_cast<size_t>(kLineSize) - 1;
          		memcpy(g_ring[slot], buf, n);
          		g_ring[slot][n] = 0;
          	}

          	buf[len++] = '\n';

          	if (g_trace_fd >= 0)
          	{
          		wr(g_trace_fd, buf, len);
          	}
          }

          void* heartbeat_main(void*)
          {
          	pthread_setname_np("bs-heartbeat");
          	unsigned long last_resident = 0;

          	for (int tick = 0; tick < 300; ++tick) // first ~5 minutes only
          	{
          		sleep(1);

          		unsigned long resident = 0;
          		unsigned long free_bytes = 0;
          		unsigned long inactive_bytes = 0;
          		get_mem(&resident, &free_bytes, &inactive_bytes);

          		const unsigned long delta = resident > last_resident ? resident - last_resident : last_resident - resident;

          		if (tick % 5 == 0 || delta >= (8UL << 20))
          		{
          			// file only: do not push useful breadcrumbs out of the ring
          			char line[220];
          			const int n = snprintf(line, sizeof(line), "[%7ldms hb   ] HB resident=%lu MB free=%lu MB inactive=%lu MB\n",
          				uptime_ms(), resident >> 20, free_bytes >> 20, inactive_bytes >> 20);

          			if (g_trace_fd >= 0 && n > 0)
          			{
          				wr(g_trace_fd, line, static_cast<size_t>(n));
          			}

          			last_resident = resident;
          		}
          	}

          	return nullptr;
          }

          } // namespace

          // ---------------------------------------------------------------------------
          // public C API (see bsios_bridge.h)
          // ---------------------------------------------------------------------------
          extern "C" void bsios_trace(const char* fmt, ...)
          {
          	va_list ap;
          	va_start(ap, fmt);
          	trace_v(true, fmt, ap);
          	va_end(ap);
          }

          extern "C" void bsios_trace_mem(const char* tag)
          {
          	unsigned long resident = 0;
          	unsigned long free_bytes = 0;
          	unsigned long inactive_bytes = 0;
          	get_mem(&resident, &free_bytes, &inactive_bytes);
          	bsios_trace("MEM[%s]: resident=%lu MB free=%lu MB inactive=%lu MB",
          		tag, resident >> 20, free_bytes >> 20, inactive_bytes >> 20);
          }

          extern "C" void bsios_run_state(int active)
          {
          	if (g_flag_path[0] == 0)
          	{
          		return;
          	}

          	if (active != 0)
          	{
          		const int fd = open(g_flag_path, O_WRONLY | O_CREAT | O_TRUNC, 0644);

          		if (fd >= 0)
          		{
          			close(fd);
          		}
          	}
          	else
          	{
          		unlink(g_flag_path);
          	}
          }

          extern "C" void bsios_crash_note(const char* text)
          {
          	if (g_crash_path[0] == 0)
          	{
          		return;
          	}

          	const int fd = open_crash_file();
          	ws(fd, "\n==== BStone iOS note ====\n");
          	dump_common_head(fd);
          	ws(fd, text);
          	ws(fd, "\n");

          	if (fd > 2)
          	{
          		close(fd);
          	}

          	bsios_trace("NOTE written to crash file: %.160s", text);
          }

          extern "C" void bsios_crash_thread_init(const char* name)
          {
          	const int i = __sync_fetch_and_add(&g_thread_count, 1);

          	if (i < kMaxThreads)
          	{
          		g_threads[i].th = pthread_self();
          		strncpy(g_threads[i].name, name, sizeof(g_threads[i].name) - 1);
          		g_threads[i].name[sizeof(g_threads[i].name) - 1] = 0;
          	}

          	stack_t alt;
          	alt.ss_sp = malloc(kAltStackSize);
          	alt.ss_size = kAltStackSize;
          	alt.ss_flags = 0;

          	if (alt.ss_sp != nullptr)
          	{
          		sigaltstack(&alt, nullptr);
          	}

          	pthread_setname_np(name);
          }

          extern "C" void bsios_crash_install_dir(const char* dir, const char* device_info)
          {
          	gettimeofday(&g_t0, nullptr);

          	snprintf(g_dir, sizeof(g_dir), "%s", dir);
          	const size_t dir_len = strlen(g_dir);

          	if (dir_len > 0 && g_dir[dir_len - 1] != '/' && dir_len + 1 < sizeof(g_dir))
          	{
          		g_dir[dir_len] = '/';
          		g_dir[dir_len + 1] = 0;
          	}

          	mkdir(g_dir, 0755);

          	snprintf(g_crash_path, sizeof(g_crash_path), "%sbstone_crash.txt", g_dir);
          	snprintf(g_trace_path, sizeof(g_trace_path), "%sbstone_trace.txt", g_dir);
          	snprintf(g_flag_path, sizeof(g_flag_path), "%sbstone_running.flag", g_dir);
          	snprintf(g_device_info, sizeof(g_device_info), "%s", device_info != nullptr ? device_info : "?");

          	const bool had_flag = access(g_flag_path, F_OK) == 0;

          	struct stat st;

          	if (stat(g_crash_path, &st) == 0 && st.st_size > 256 * 1024)
          	{
          		unlink(g_crash_path);
          	}

          	char prev_trace[1000];
          	snprintf(prev_trace, sizeof(prev_trace), "%sbstone_trace_prev.txt", g_dir);
          	rename(g_trace_path, prev_trace);
          	g_trace_fd = open(g_trace_path, O_WRONLY | O_CREAT | O_TRUNC, 0644);

          	bsios_trace("==== BStone iOS diagnostics ====");
          	bsios_trace("build: %s", BS_BUILD_ID);
          	bsios_trace("device: %s", g_device_info);
          	bsios_trace("files: %s{bstone_log.txt,bstone_trace.txt,bstone_trace_prev.txt,bstone_crash.txt}", g_dir);

          	if (had_flag)
          	{
          		bsios_trace("PREVIOUS RUN DIED IN THE FOREGROUND WITHOUT A CRASH REPORT: killed by the system "
          			"(low memory / jetsam, watchdog or a hang) is likely. See bstone_trace_prev.txt (HB lines show memory).");
          	}
          	else
          	{
          		bsios_trace("previous run: no 'died in foreground' marker (clean exit, backgrounded, or a crash report exists)");
          	}

          	bsios_trace_mem("startup");

          	// Alternate stack for the main thread, then the handlers.
          	stack_t alt;
          	alt.ss_sp = malloc(kAltStackSize);
          	alt.ss_size = kAltStackSize;
          	alt.ss_flags = 0;

          	if (alt.ss_sp != nullptr)
          	{
          		sigaltstack(&alt, nullptr);
          	}

          	install_signal_handlers();
          	std::set_terminate(&bs_terminate_handler);

          	pthread_t hb;
          	pthread_attr_t attr;
          	pthread_attr_init(&attr);
          	pthread_attr_setdetachstate(&attr, PTHREAD_CREATE_DETACHED);

          	if (pthread_create(&hb, &attr, &heartbeat_main, nullptr) != 0)
          	{
          		bsios_trace("heartbeat thread failed to start");
          	}

          	pthread_attr_destroy(&attr);

          	bsios_trace("crash handlers installed");
          }
