          // BSHost.h -- shared state between the UIKit layer and the bridge implementation (BSHost.mm, BSGL.mm,
          // BSAudio.mm). Objective-C++, ARC, iOS 7.0+ (armv7).
          #import <UIKit/UIKit.h>

          @class BSGLView;

          #ifdef __cplusplus
          extern "C" {
          #endif

          // ---- configuration (Documents/bstone_ios.ini) ----
          typedef struct BSConfig {
          	float render_scale;       // drawable pixels per point; 0 = "use the screen scale"
          	int touch_controls;       // 1 = draw the on-screen controls
          	int show_fps_hint;        // reserved
          } BSConfig;

          BSConfig BSHost_GetConfig(void);
          void BSHost_LoadConfig(void);

          // ---- paths ----
          NSString* BSHost_DocumentsPath(void);   // with trailing slash

          // ---- game thread ----
          // Builds argv (data_dir/profile_dir + user "args=") and starts the game thread. Call once, from the main thread.
          void BSHost_StartGame(void);
          BOOL BSHost_IsGameRunning(void);

          // ---- view ----
          // The game view is created on the main thread; the game thread only reads its pixel size.
          void BSHost_SetGLView(BSGLView* view);
          BSGLView* BSHost_GLView(void);
          void BSHost_SetViewPixelSize(int width, int height);

          // ---- activity (application state) ----
          // While inactive the game thread parks inside bsios_gl_swap() (iOS forbids GL calls in background).
          void BSHost_SetActive(BOOL active);
          // Waits (at most timeout_ms) until the game thread is parked or has finished. Main thread only.
          void BSHost_WaitUntilParked(int timeout_ms);

          // ---- audio (BSAudio.mm) ----
          void BSAudio_SetSuspended(BOOL suspended);   // application state: background / interruption

          // ---- GL (BSGL.mm) ----
          // Parking support: called by the game thread from bsios_gl_swap().
          void BSHost_ParkIfInactive(void (*before_park)(void));

          #ifdef __cplusplus
          }
