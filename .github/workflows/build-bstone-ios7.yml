          #!/bin/sh
          # Generates build/gen/bstone_version_.h (replacement of CMake's configure_file) -- run by the Makefile.
          mkdir -p "$1" && printf '1, 3, 4, "", "ios7", "1.3.4+ios7", "1.3.4+ios7",\n' > "$1/bstone_version_.h"
          BSIOS_EOF
