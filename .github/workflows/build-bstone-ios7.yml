           			driver_types.emplace_back(AudioDriverType::system);
           		}
           		else
          BSIOS_EOF
          if patch -p1 -R --dry-run -s < /tmp/core.patch >/dev/null 2>&1; then
            echo "core already patched"
          else
            patch -p1 < /tmp/core.patch
          fi

      - name: Patch GL extension parsing (no std::istringstream)
        working-directory: ${{ env.BS_ROOT }}
        run: |
          python3 - <<'BSIOS_PY'
          import re, sys
          p = "src/bstone/src/bstone_gl_r3r_extension_mgr.cpp"
          s = open(p, encoding="utf-8").read()
          if "istringstream{gl_extensions_std_string}" not in s:
              print("extension parsing already patched")
              sys.exit(0)
          old = (
              "\tauto iss = std::istringstream{gl_extensions_std_string};\n"
              "\textension_names_.reserve(extension_count);\n"
              "\n"
              "\textension_names_.assign(\n"
              "\t\tstd::istream_iterator<std::string>{iss},\n"
              "\t\tstd::istream_iterator<std::string>{});\n"
          )
          new = (
              "\t// BSTONE_IOS: split by whitespace by hand; std::istringstream is not usable with the old libc++.dylib of iOS 7.\n"
              "\textension_names_.clear();\n"
              "\textension_names_.reserve(extension_count);\n"
              "\n"
              "\t{\n"
              "\t\tconst auto& gl_ext = gl_extensions_std_string;\n"
              "\t\tauto pos = std::string::size_type{};\n"
              "\n"
              "\t\twhile (pos < gl_ext.size())\n"
              "\t\t{\n"
              "\t\t\twhile (pos < gl_ext.size() && std::isspace(static_cast<unsigned char>(gl_ext[pos])) != 0)\n"
              "\t\t\t{\n"
              "\t\t\t\t++pos;\n"
              "\t\t\t}\n"
              "\n"
              "\t\t\tconst auto begin = pos;\n"
              "\n"
              "\t\t\twhile (pos < gl_ext.size() && std::isspace(static_cast<unsigned char>(gl_ext[pos])) == 0)\n"
              "\t\t\t{\n"
              "\t\t\t\t++pos;\n"
              "\t\t\t}\n"
              "\n"
              "\t\t\tif (pos > begin)\n"
              "\t\t\t{\n"
              "\t\t\t\textension_names_.emplace_back(gl_ext, begin, pos - begin);\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\t}\n"
          )
          assert s.count(old) == 1, "pattern not found"
          s = s.replace(old, new)
          s = s.replace("#include <assert.h>\n", "#include <assert.h>\n#include <ctype.h>\n#include <cctype>\n", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched extension parsing")
          BSIOS_PY

      - name: Generate source list
        working-directory: ${{ env.BS_ROOT }}
        run: python3 ios/tools/gen_sources.py

      - name: Build .deb + .app via Theos
        working-directory: ${{ env.BS_ROOT }}/ios
        env:
          FINALPACKAGE: "1"
        run: |
          make package FINALPACKAGE=1 -j"$(nproc)"
          ls -la packages

      - name: Verify deployment target is iOS 7.0
        working-directory: ${{ env.BS_ROOT }}/ios
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          BIN="$(find .theos -type f -name BStoneiOS7 | head -n1)"
          echo "Binary: $BIN"
          OT="$(command -v llvm-otool || command -v otool || true)"
          [ -n "$OT" ] || { echo "no otool; skipping"; exit 0; }
          "$OT" -l "$BIN" > /tmp/lc.txt
          grep -A3 LC_VERSION_MIN_IPHONEOS /tmp/lc.txt || true
          grep -q LC_VERSION_MIN_IPHONEOS /tmp/lc.txt || { echo "missing LC_VERSION_MIN_IPHONEOS"; exit 1; }
          if grep -q LC_BUILD_VERSION /tmp/lc.txt; then echo "LC_BUILD_VERSION: old dyld cannot load it"; exit 1; fi
          grep -A3 LC_VERSION_MIN_IPHONEOS /tmp/lc.txt | grep -q "version 7.0" || { echo "deployment target is not 7.0"; exit 1; }

      - name: Pack .ipa
        working-directory: ${{ env.BS_ROOT }}/ios
        run: |
          APP_DIR="$(find .theos -type d -name 'BStoneiOS7.app' | head -n1)"
          echo "Using APP_DIR=$APP_DIR"
          rm -rf ipa_build && mkdir -p ipa_build/Payload
          cp -a "$APP_DIR" ipa_build/Payload/
          (cd ipa_build && zip -rq ../packages/BStone-iOS7-armv7.ipa Payload)
          ls -la packages

      - name: Save symbols (unstripped binary + symbol list)
        if: always()
        working-directory: ${{ env.BS_ROOT }}/ios
        run: |
          mkdir -p symbols
          [ -d .theos ] || { echo "no .theos directory; nothing to save"; exit 0; }
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          echo "BStoneiOS7 binaries found by Theos:"
          find .theos -type f -name BStoneiOS7 -printf '%s bytes  %p\n' | sort -nr
          BIN="$(find .theos -type f -name BStoneiOS7 -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          [ -n "$BIN" ] || { echo "no binary found"; exit 0; }
          echo "Largest (assumed unstripped): $BIN"
          cp "$BIN" symbols/BStoneiOS7.unstripped
          OT="$(command -v llvm-otool || command -v otool || true)"
          NM="$(command -v llvm-nm || command -v nm || true)"
          : > symbols/uuid.txt
          for f in $(find .theos -type f -name BStoneiOS7); do
            echo "== $f" >> symbols/uuid.txt
            if [ -n "$OT" ]; then "$OT" -l "$f" 2>/dev/null | grep -A2 LC_UUID >> symbols/uuid.txt || true; fi
          done
          if [ -n "$NM" ]; then
            "$NM" -n -C "$BIN" > symbols/symbols.txt 2>/dev/null || "$NM" -n "$BIN" > symbols/symbols.txt 2>/dev/null || true
          fi
          ls -la symbols
          cat symbols/uuid.txt
          head -n 5 symbols/symbols.txt || true

      - name: Upload .ipa + .deb
        uses: actions/upload-artifact@v4
        with:
          name: BStone-iOS7-armv7
          path: |
            ${{ env.BS_ROOT }}/ios/packages/*.ipa
            ${{ env.BS_ROOT }}/ios/packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BStone-iOS7-symbols
          path: ${{ env.BS_ROOT }}/ios/symbols/*
          if-no-files-found: warn
          retention-days: 30
