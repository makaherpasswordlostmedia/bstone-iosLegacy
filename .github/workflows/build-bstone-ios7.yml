name: BStone iOS 7 (armv7) .ipa + .deb

# One self-contained workflow: drop THIS file into .github/workflows/ of a repository that contains the
# BStone sources (the bstone-master tree). Everything else -- the whole iOS port (ios/ folder), the patches
# to the BStone core, Theos, the toolchain and the SDK -- is created by the steps below.
# If the repository has no BStone sources, upstream master is cloned.
#
# Result: artifact with BStone-iOS7-armv7.ipa / .deb (unsigned; jailbreak install or re-sign yourself).

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg build-essential perl curl ca-certificates \
                                  zip unzip xz-utils bzip2 git fakeroot make patch python3

      - name: Install Theos + iOS cross toolchain
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL \
            "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" \
            -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -20

      - name: Install iPhoneOS 9.3 SDK
        run: |
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 \
            "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Remove clang module maps (SDK + toolchain)
        run: |
          # Theos builds with -fmodules; the module maps of the old SDK and of the toolchain's libc++ do not
          # match this clang and produce "could not build module" / cyclic Darwin errors. Without module maps
          # clang falls back to plain textual #include.
          find "$THEOS/sdks" "$THEOS/toolchain" \( -name 'module.map' -o -name 'module.modulemap' \) -print -delete | wc -l

      - name: Check libc++ headers
        run: |
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          CXXDIR="$THEOS/toolchain/linux/iphone/include/c++/v1"
          if [ -f "$SDK/usr/include/c++/v1/vector" ]; then
            echo "SDK libc++ headers found (used by the Makefile)"
          else
            echo "SDK has no libc++ headers: using the toolchain's libc++ ($CXXDIR)"
            ls "$CXXDIR" | head -5
          fi
          # The toolchain tarball ships libc++ headers without the configure-time __config_site.
          if [ ! -f "$CXXDIR/__config_site" ]; then
            cat > "$CXXDIR/__config_site" <<'CFG'
          #ifndef _LIBCPP_CONFIG_SITE
          #define _LIBCPP_CONFIG_SITE
          #define _LIBCPP_ABI_VERSION 1
          #define _LIBCPP_ABI_NAMESPACE __1
          #define _LIBCPP_HARDENING_MODE_DEFAULT _LIBCPP_HARDENING_MODE_NONE
          #define _LIBCPP_PSTL_CPU_BACKEND_SERIAL 1
          #define _LIBCPP_DISABLE_AVAILABILITY 1
          #endif
          CFG
          fi
          cat "$CXXDIR/__config_site"

      - name: Locate BStone sources (or clone upstream)
        run: |
          ROOT=$(find . -maxdepth 3 -path ./theos -prune -o -path '*/src/bstone/CMakeLists.txt' -print | head -n1)
          if [ -z "$ROOT" ]; then
            echo "No BStone sources in the repository: cloning upstream master"
            git clone --depth 1 https://github.com/bibendovsky/bstone.git bstone-upstream
            ROOT=bstone-upstream/src/bstone/CMakeLists.txt
          fi
          BS_ROOT=$(cd "$(dirname "$ROOT")/../.." && pwd)
          echo "BS_ROOT=$BS_ROOT" | tee -a "$GITHUB_ENV"
          ls "$BS_ROOT"

      - name: Write the iOS port (ios/)
        working-directory: ${{ env.BS_ROOT }}
        run: |
          set -e
          mkdir -p "$(dirname 'ios/Makefile')"
          cat > 'ios/Makefile' <<'BSIOS_EOF'
          # BStone for 32-bit iOS 7+ (armv7, OpenGL ES 2.0) -- Theos application.
          #
          # Same toolchain approach as the zelda3 armv7 port: iPhoneOS 9.3 SDK, modern clang, but the deployment
          # target is lowered to 7.0 (only APIs available on iOS 7 are used: UIAlertView, AudioQueue, EAGL...).
          #
          #   export THEOS=~/theos ; make package        (run in this directory)
          TARGET := iphone:clang:9.3:7.0
          ARCHS = armv7

          export ADDITIONAL_OBJCFLAGS += -Wno-error=deprecated-module-dot-map -Wno-deprecated-module-dot-map

          # Clang modules break here (the SDK / toolchain module maps are for other clang versions): plain textual includes.
          export USE_MODULES = 0

          include $(THEOS)/makefiles/common.mk
          include sources.mk

          # bstone_version_.h replaces CMake's configure_file().
          GEN_DIR = $(THEOS_PROJECT_DIR)/.theos/gen
          $(shell $(THEOS_PROJECT_DIR)/tools/gen_version.sh $(GEN_DIR))

          APPLICATION_NAME = BStoneiOS7

          BStoneiOS7_FILES = \
          	$(BSTONE_ENGINE_FILES) \
          	$(BSTONE_LIB_FILES) \
          	$(wildcard src/sys/*.cpp) \
          	$(wildcard src/app/*.mm)

          BS_INCLUDES = \
          	-I$(THEOS_PROJECT_DIR)/src -I$(THEOS_PROJECT_DIR)/src/sys \
          	-I$(THEOS_PROJECT_DIR)/../src/bstone/src -I$(THEOS_PROJECT_DIR)/../src/bstone/src/dosbox \
          	-I$(GEN_DIR) \
          	-I$(THEOS_PROJECT_DIR)/../src/lib/khronos/include \
          	-I$(THEOS_PROJECT_DIR)/../src/lib/nuked_opl3/include \
          	-I$(THEOS_PROJECT_DIR)/../src/lib/openal_soft/include/AL \
          	-I$(THEOS_PROJECT_DIR)/../src/lib/stb/include \
          	-I$(THEOS_PROJECT_DIR)/../src/lib/xbrz/include \
          	-I$(THEOS_PROJECT_DIR)/../src/lib/vulkan/include

          BS_WARN = -Wno-deprecated-declarations -Wno-unknown-warning-option -Wno-unused-command-line-argument \
          	-Wno-error=deprecated-module-dot-map -Wno-deprecated-module-dot-map \
          	-Wno-error=incomplete-umbrella -Wno-incomplete-umbrella \
          	-Wno-error=non-modular-include-in-framework-module -Wno-non-modular-include-in-framework-module \
          	-Wno-error=non-modular-include-in-module -Wno-non-modular-include-in-module \
          	-Wno-error

          BStoneiOS7_CFLAGS = -O2 -fno-modules -fno-cxx-modules -DNDEBUG -fno-omit-frame-pointer -DBSTONE_IOS=1 -DSTBI_NO_THREAD_LOCALS -DVK_NO_PROTOTYPES -fno-strict-aliasing \
          	$(BS_INCLUDES) $(BS_WARN)
          # C++14 only: libc++ of the 9.3 SDK, nothing newer than iOS 7 runtime features (no thread_local, no clock_gettime).
          # The toolchain ships a modern libc++ (clang 19, needs __config_site + C++ modules) whose ABI is newer than the
          # libc++.dylib of iOS 7. Use the libc++ headers of the 9.3 SDK instead and turn clang modules off.
          BS_SDK = $(THEOS)/sdks/iPhoneOS9.3.sdk
          ifneq ($(wildcard $(BS_SDK)/usr/include/c++/v1/vector),)
          BS_LIBCXX = -nostdinc++ -isystem $(BS_SDK)/usr/include/c++/v1
          endif
          BStoneiOS7_CXXFLAGS = -std=gnu++14 -stdlib=libc++ $(BS_LIBCXX)
          BStoneiOS7_OBJCFLAGS = -fobjc-arc
          BStoneiOS7_LDFLAGS = -stdlib=libc++
          BStoneiOS7_FRAMEWORKS = UIKit Foundation CoreGraphics QuartzCore OpenGLES AudioToolbox AVFoundation
          BStoneiOS7_CODESIGN_FLAGS = -Sentitlements.plist

          include $(THEOS_MAKE_PATH)/application.mk
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/Resources/Info.plist')"
          cat > 'ios/Resources/Info.plist' <<'BSIOS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleIdentifier</key><string>org.bibendovsky.bstone.ios7</string>
          	<key>CFBundleName</key><string>BStone</string>
          	<key>CFBundleDisplayName</key><string>BStone</string>
          	<key>CFBundleExecutable</key><string>BStoneiOS7</string>
          	<key>CFBundleVersion</key><string>1.3.4</string>
          	<key>CFBundleShortVersionString</key><string>1.3.4</string>
          	<key>CFBundlePackageType</key><string>APPL</string>
          	<key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          	<key>MinimumOSVersion</key><string>7.0</string>
          	<key>LSRequiresIPhoneOS</key><true/>
          	<key>UIRequiredDeviceCapabilities</key><array><string>armv7</string><string>opengles-2</string></array>
          	<key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          	<key>UIStatusBarHidden</key><true/>
          	<key>UIViewControllerBasedStatusBarAppearance</key><false/>
          	<key>UIRequiresFullScreen</key><true/>
          	<key>UISupportedInterfaceOrientations</key>
          	<array><string>UIInterfaceOrientationLandscapeRight</string><string>UIInterfaceOrientationLandscapeLeft</string></array>
          	<key>UISupportedInterfaceOrientations~ipad</key>
          	<array><string>UIInterfaceOrientationLandscapeRight</string><string>UIInterfaceOrientationLandscapeLeft</string></array>
          	<key>UIFileSharingEnabled</key><true/>
          	<key>UIPrerenderedIcon</key><true/>
          </dict>
          </plist>
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/control')"
          cat > 'ios/control' <<'BSIOS_EOF'
          Package: org.bibendovsky.bstone.ios7
          Name: BStone
          Version: 1.3.4-ios7
          Architecture: iphoneos-arm
          Description: BStone (Blake Stone: Aliens of Gold / Planet Strike source port) for 32-bit iOS 7+ (armv7, OpenGL ES 2.0)
          Maintainer: BStone iOS port
          Author: Boris I. Bendovsky and contributors
          Section: Games
          Depends: firmware (>= 7.0)
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/entitlements.plist')"
          cat > 'ios/entitlements.plist' <<'BSIOS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          	<key>platform-application</key><true/>
          	<key>get-task-allow</key><true/>
          </dict></plist>
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/app/BSAppDelegate.h')"
          cat > 'ios/src/app/BSAppDelegate.h' <<'BSIOS_EOF'
          #import <UIKit/UIKit.h>
          @interface BSAppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow* window;
          @end
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/app/BSAppDelegate.mm')"
          cat > 'ios/src/app/BSAppDelegate.mm' <<'BSIOS_EOF'
          #import "BSAppDelegate.h"
          #import "BSGameViewController.h"
          #import "BSHost.h"
          #import <AVFoundation/AVFoundation.h>
          #include "bsios_bridge.h"

          @implementation BSAppDelegate

          - (BOOL)application:(UIApplication*)application didFinishLaunchingWithOptions:(NSDictionary*)launchOptions {
          	bsios_trace("AppDelegate didFinishLaunching");
          	BSHost_LoadConfig();
          	application.idleTimerDisabled = YES;
          	self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
          	self.window.backgroundColor = [UIColor blackColor];
          	self.window.rootViewController = [[BSGameViewController alloc] init];
          	[self.window makeKeyAndVisible];

          	[[NSNotificationCenter defaultCenter] addObserverForName:AVAudioSessionInterruptionNotification
          	    object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification* n) {
          		NSUInteger type = [n.userInfo[AVAudioSessionInterruptionTypeKey] unsignedIntegerValue];
          		BSAudio_SetSuspended(type == AVAudioSessionInterruptionTypeBegan);
          	}];
          	return YES;
          }

          - (void)applicationWillResignActive:(UIApplication*)application {
          	bsios_trace("AppDelegate willResignActive");
          	bsios_run_state(0);
          	bsios_event_push_focus(0);
          	BSAudio_SetSuspended(YES);
          	BSHost_SetActive(NO);
          	// GL must be idle before we return to the system; the game thread parks in bsios_gl_swap().
          	BSHost_WaitUntilParked(300);
          }

          - (void)applicationDidBecomeActive:(UIApplication*)application {
          	bsios_trace("AppDelegate didBecomeActive");
          	bsios_run_state(1);
          	BSHost_SetActive(YES);
          	BSAudio_SetSuspended(NO);
          	bsios_event_push_focus(1);
          }

          - (void)applicationDidReceiveMemoryWarning:(UIApplication*)application {
          	bsios_trace_mem("MEMORY WARNING");
          	NSLog(@"BStone: memory warning");
          }

          @end
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/app/BSAudio.mm')"
          cat > 'ios/src/app/BSAudio.mm' <<'BSIOS_EOF'
          // BSAudio.mm -- AudioQueue output (bsios_audio_*). AudioQueue has been stable since iOS 2 and needs no
          // session graph. The mixer callback is invoked directly on the queue's own thread.
          //
          // Buffers are filled only after the game un-pauses the device for the first time: BStone opens the
          // device while its mixer is still being constructed, so the callback must not run before that.
          #import "BSHost.h"
          #import <AudioToolbox/AudioToolbox.h>
          #import <AVFoundation/AVFoundation.h>

          #include <string.h>
          #include "bsios_bridge.h"

          enum { kBufferCount = 3 };

          static AudioQueueRef g_queue;
          static AudioQueueBufferRef g_buffers[kBufferCount];
          static bsios_audio_callback g_callback;
          static void* g_user_data;
          static int g_channels, g_frames;
          static BOOL g_primed;
          static BOOL g_game_paused = YES;     // the game's own pause flag
          static BOOL g_suspended;             // application state
          static BOOL g_running;               // queue actually started
          static NSObject* g_lock;

          static void FillBuffer(AudioQueueBufferRef buf) {
          	const int sample_count = g_frames * g_channels;
          	buf->mAudioDataByteSize = (UInt32)(sample_count * sizeof(float));
          	if (g_callback)
          		g_callback(g_user_data, (float*)buf->mAudioData, sample_count);
          	else
          		memset(buf->mAudioData, 0, buf->mAudioDataByteSize);
          }

          static void OutputCallback(void*, AudioQueueRef queue, AudioQueueBufferRef buf) {
          	FillBuffer(buf);
          	AudioQueueEnqueueBuffer(queue, buf, 0, NULL);
          }

          static BOOL ActivateSession(void) {
          	AVAudioSession* session = [AVAudioSession sharedInstance];
          	NSError* err = nil;
          	[session setCategory:AVAudioSessionCategoryAmbient error:&err];
          	if (err) { NSLog(@"BStone audio: setCategory failed: %@", err); return NO; }
          	err = nil;
          	[session setActive:YES error:&err];
          	if (err) { NSLog(@"BStone audio: setActive failed: %@", err); return NO; }
          	return YES;
          }

          // Must be called with g_lock held.
          static void UpdateRunningLocked(void) {
          	if (!g_queue) return;
          	BOOL want = !g_game_paused && !g_suspended;
          	if (want && !g_running) {
          		if (!g_primed) {
          			for (int i = 0; i < kBufferCount; i++) {
          				FillBuffer(g_buffers[i]);
          				AudioQueueEnqueueBuffer(g_queue, g_buffers[i], 0, NULL);
          			}
          			g_primed = YES;
          		}
          		if (AudioQueueStart(g_queue, NULL) == noErr) g_running = YES;
          	} else if (!want && g_running) {
          		AudioQueuePause(g_queue);
          		g_running = NO;
          	}
          }

          extern "C" int bsios_audio_open(int desired_rate, int channel_count, int desired_frame_count,
                                          bsios_audio_callback callback, void* user_data,
                                          int* effective_rate, int* effective_frame_count) {
          	static dispatch_once_t once;
          	dispatch_once(&once, ^{ g_lock = [[NSObject alloc] init]; });

          	@synchronized (g_lock) {
          		if (g_queue) return -1;
          		if (!ActivateSession()) return -2;

          		AudioStreamBasicDescription fmt;
          		memset(&fmt, 0, sizeof(fmt));
          		fmt.mSampleRate = desired_rate;
          		fmt.mFormatID = kAudioFormatLinearPCM;
          		fmt.mFormatFlags = kAudioFormatFlagIsFloat | kAudioFormatFlagIsPacked;   // native-endian Float32
          		fmt.mBitsPerChannel = 32;
          		fmt.mChannelsPerFrame = (UInt32)channel_count;
          		fmt.mBytesPerFrame = (UInt32)(channel_count * sizeof(float));
          		fmt.mFramesPerPacket = 1;
          		fmt.mBytesPerPacket = fmt.mBytesPerFrame;

          		g_callback = callback;
          		g_user_data = user_data;
          		g_channels = channel_count;
          		g_frames = desired_frame_count;

          		// NULL run loop: the queue uses its own internal thread for the callback (a main run loop here
          		// is a known cause of multi-second hangs in AudioQueueStop).
          		OSStatus st = AudioQueueNewOutput(&fmt, OutputCallback, NULL, NULL, NULL, 0, &g_queue);
          		if (st != noErr) { g_queue = NULL; return (int)st; }

          		for (int i = 0; i < kBufferCount; i++) {
          			st = AudioQueueAllocateBuffer(g_queue, (UInt32)(g_frames * g_channels * sizeof(float)), &g_buffers[i]);
          			if (st != noErr) { AudioQueueDispose(g_queue, true); g_queue = NULL; return (int)st; }
          		}

          		g_primed = NO;
          		g_running = NO;
          		g_game_paused = YES;
          		*effective_rate = desired_rate;
          		*effective_frame_count = desired_frame_count;
          	}
          	return 0;
          }

          extern "C" void bsios_audio_pause(int is_paused) {
          	@synchronized (g_lock) {
          		g_game_paused = is_paused != 0;
          		UpdateRunningLocked();
          	}
          }

          extern "C" void bsios_audio_close(void) {
          	AudioQueueRef q;
          	@synchronized (g_lock) {
          		q = g_queue;
          		g_queue = NULL;
          		g_running = NO;
          		g_primed = NO;
          		g_callback = NULL;
          	}
          	if (q) {
          		// Synchronous stop: safe, the callback runs on the queue's own thread, not on ours.
          		AudioQueueStop(q, true);
          		AudioQueueDispose(q, true);
          	}
          }

          void BSAudio_SetSuspended(BOOL suspended) {
          	if (!g_lock) return;   // audio not opened yet
          	if (!suspended) ActivateSession();   // after an interruption the session must be re-activated
          	@synchronized (g_lock) {
          		g_suspended = suspended;
          		UpdateRunningLocked();
          	}
          }
          BSIOS_EOF
          mkdir -p "$(dirname 'ios/src/app/BSGL.mm')"
          cat > 'ios/src/app/BSGL.mm' <<'BSIOS_EOF'
          // BSGL.mm -- OpenGL ES 2.0 part of bsios_bridge.h.
          //
          // iOS has no default framebuffer: a framebuffer object with a color renderbuffer allocated from the
          // CAEAGLLayer plays that role. (The C++ symbol resolver maps glBindFramebuffer(.., 0) to it.)
          //
          // Threading: everything here runs on the game thread, which owns the EAGLContext. The main thread
          // is never blocked.
          #import "BSHost.h"
          #import "BSGLView.h"

          #import <OpenGLES/EAGL.h>
          #import <OpenGLES/ES2/gl.h>
          #import <OpenGLES/ES2/glext.h>
          #import <QuartzCore/QuartzCore.h>

          #include "bsios_bridge.h"

          static EAGLContext* g_ctx;
          static GLuint g_fbo, g_color_rb, g_depth_rb;
          static GLint g_w, g_h;

          static void DestroyGLObjects(void) {
          	if (!g_ctx) return;
          	[EAGLContext setCurrentContext:g_ctx];
          	if (g_depth_rb) glDeleteRenderbuffers(1, &g_depth_rb);
          	if (g_color_rb) glDeleteRenderbuffers(1, &g_color_rb);
          	if (g_fbo) glDeleteFramebuffers(1, &g_fbo);
          	g_depth_rb = g_color_rb = g_fbo = 0;
          	glFinish();
          	[EAGLContext setCurrentContext:nil];
          	g_ctx = nil;
          	g_w = g_h = 0;
          }

          extern "C" void bsios_gl_destroy(void) {
          	DestroyGLObjects();
          }

          static const char* GLStr(GLenum name) {
          	const char* v = (const char*)glGetString(name);
          	return v ? v : "(null)";
          }

          static void TraceGLError(const char* where) {
          	GLenum e = glGetError();
          	if (e != GL_NO_ERROR) bsios_trace("GL ERROR 0x%04X after %s", (unsigned)e, where);
          }

          extern "C" int bsios_gl_create(int depth_bits) {
          	bsios_trace("bsios_gl_create(depth_bits=%d)", depth_bits);
          	bsios_trace_mem("before gl create");
          	DestroyGLObjects();

          	BSGLView* view = BSHost_GLView();
          	if (!view) {
          		bsios_trace("bsios_gl_create: no BSGLView yet -> -1");
          		return -1;
          	}
          	bsios_trace("view %.0fx%.0f scale=%.1f layer=%s", (double)view.bounds.size.width,
          	            (double)view.bounds.size.height, (double)view.contentScaleFactor,
          	            NSStringFromClass([view.layer class]).UTF8String);

          	g_ctx = [[EAGLContext alloc] initWithAPI:kEAGLRenderingAPIOpenGLES2];
          	bsios_trace("EAGLContext(ES2) = %p", (__bridge void*)g_ctx);
          	if (!g_ctx || ![EAGLContext setCurrentContext:g_ctx]) {
          		bsios_trace("EAGLContext create/setCurrentContext FAILED -> -2");
          		g_ctx = nil;
          		return -2;
          	}

          	bsios_trace("GL_VENDOR=%s", GLStr(GL_VENDOR));
          	bsios_trace("GL_RENDERER=%s", GLStr(GL_RENDERER));
          	bsios_trace("GL_VERSION=%s", GLStr(GL_VERSION));
          	bsios_trace("GL_SHADING_LANGUAGE_VERSION=%s", GLStr(GL_SHADING_LANGUAGE_VERSION));
          	{
          		const char* ext = GLStr(GL_EXTENSIONS);
          		size_t len = strlen(ext);
          		for (size_t i = 0; i < len; i += 400) bsios_trace("GL_EXTENSIONS[%zu]: %.400s", i, ext + i);
          	}
          	{
          		GLint v = 0;
          		glGetIntegerv(GL_MAX_TEXTURE_SIZE, &v);
          		GLint rb = 0;
          		glGetIntegerv(GL_MAX_RENDERBUFFER_SIZE, &rb);
          		GLint va = 0;
          		glGetIntegerv(GL_MAX_VERTEX_ATTRIBS, &va);
          		GLint tu = 0;
          		glGetIntegerv(GL_MAX_TEXTURE_IMAGE_UNITS, &tu);
          		bsios_trace("limits: max_texture=%d max_renderbuffer=%d max_vertex_attribs=%d max_texture_units=%d",
          		            (int)v, (int)rb, (int)va, (int)tu);
          	}
          	TraceGLError("context creation / queries");

          	glGenFramebuffers(1, &g_fbo);
          	glGenRenderbuffers(1, &g_color_rb);
          	glBindFramebuffer(GL_FRAMEBUFFER, g_fbo);
          	glBindRenderbuffer(GL_RENDERBUFFER, g_color_rb);
          	bsios_trace("fbo=%u color_rb=%u", (unsigned)g_fbo, (unsigned)g_color_rb);
          	TraceGLError("fbo/renderbuffer generation");

          	if (![g_ctx renderbufferStorage:GL_RENDERBUFFER fromDrawable:(CAEAGLLayer*)view.layer]) {
          		bsios_trace("renderbufferStorage:fromDrawable: FAILED -> -3");
          		DestroyGLObjects();
          		return -3;
          	}
          	glGetRenderbufferParameteriv(GL_RENDERBUFFER, GL_RENDERBUFFER_WIDTH, &g_w);
          	glGetRenderbufferParameteriv(GL_RENDERBUFFER, GL_RENDERBUFFER_HEIGHT, &g_h);
          	glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_RENDERBUFFER, g_color_rb);
          	bsios_trace("drawable renderbuffer %dx%d", (int)g_w, (int)g_h);
          	TraceGLError("color attachment");

          	if (depth_bits > 0) {
          		glGenRenderbuffers(1, &g_depth_rb);
          		glBindRenderbuffer(GL_RENDERBUFFER, g_depth_rb);
          		// 24-bit depth (GL_OES_depth24) exists on every iOS 7 capable GPU, but 16 bits is what
          		// the renderer asks for and is cheaper on the tile-based SGX parts.
          		glRenderbufferStorage(GL_RENDERBUFFER, depth_bits > 16 ? GL_DEPTH_COMPONENT24_OES : GL_DEPTH_COMPONENT16,
          		                      g_w, g_h);
          		glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_DEPTH_ATTACHMENT, GL_RENDERBUFFER, g_depth_rb);
          		bsios_trace("depth renderbuffer %u (%d bit)", (unsigned)g_depth_rb, depth_bits > 16 ? 24 : 16);
          		TraceGLError("depth attachment");
          	}

          	GLenum status = glCheckFramebufferStatus(GL_FRAMEBUFFER);
          	bsios_trace("glCheckFramebufferStatus = 0x%04X", (unsigned)status);
          	if (status != GL_FRAMEBUFFER_COMPLETE) {
          		DestroyGLObjects();
          		return -4;
          	}

          	glViewport(0, 0, g_w, g_h);
          	TraceGLError("viewport");
          	bsios_trace_mem("after gl create");
          	bsios_trace("bsios_gl_create OK");
          	return 0;
          }

          extern "C" void bsios_gl_get_drawable_size(int* width, int* height) {
          	*width = g_w;
          	*height = g_h;
          }

          extern "C" unsigned int bsios_gl_get_default_framebuffer(void) {
          	return g_fbo;
          }

          extern "C" void bsios_gl_swap(void) {
          	if (!g_ctx) return;
          	// iOS terminates apps that issue GL commands while in background: wait here while inactive.
          	// glFinish() runs right before parking, so all queued GL work is complete when the main thread
          	// (BSHost_WaitUntilParked) lets the app go to background.
          	BSHost_ParkIfInactive(&glFinish);
          	glBindRenderbuffer(GL_RENDERBUFFER, g_color_rb);
          	[g_ctx presentRenderbuffer:GL_RENDERBUFFER];
          	static int swap_traces = 0;
          	if (swap_traces < 3) {
          		++swap_traces;
          		bsios_trace("first frames presented (#%d)", swap_traces);
          	}
          }
