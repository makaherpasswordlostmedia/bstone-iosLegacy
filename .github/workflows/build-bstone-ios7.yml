          void MessageBox::show_simple(const char* title, const char* message, MessageBoxType)
          {
          	const char* const buttons[] = {"OK"};
          	bsios_message_box(title != nullptr ? title : "", message != nullptr ? message : "", buttons, 1);
          }

          int MessageBox::show(const MessageBoxInitParam& param)
          {
          	const auto button_count = static_cast<int>(param.buttons.get_size());

          	if (button_count <= 0)
          	{
          		BSTONE_THROW_STATIC_SOURCE("No buttons.");
          	}

          	auto titles = std::vector<const char*>{};
          	titles.reserve(static_cast<std::size_t>(button_count));

          	for (auto i = 0; i < button_count; ++i)
          	{
          		titles.push_back(param.buttons[i].text != nullptr ? param.buttons[i].text : "");
          	}

          	const auto index = bsios_message_box(
          		param.title != nullptr ? param.title : "",
          		param.message != nullptr ? param.message : "",
          		titles.data(),
          		button_count);

          	if (index < 0 || index >= button_count)
          	{
          		return param.buttons[0].id;
          	}

          	return param.buttons[index].id;
          }

