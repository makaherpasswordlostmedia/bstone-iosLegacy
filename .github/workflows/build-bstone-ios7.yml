          class IosWindowMgr final : public WindowMgr
          {
          public:
          	explicit IosWindowMgr(Logger& logger)
          		:
          		logger_{logger}
          	{
          		logger_.log_information("Start up iOS window manager.");
          	}

          	~IosWindowMgr() override
          	{
          		logger_.log_information("Shut down iOS window manager.");
          	}

          private:
          	Logger& logger_;

          private:
          	WindowUPtr do_make_window(const WindowInitParam& param) override
          	{
          		return std::make_unique<IosWindow>(param);
          	}
          };

